        type: INT
        nullable: true

      - source: pf.PregnancyGravidaCount
        name: PregnancyGravidaCount
        type: INT
        nullable: true

      - source: pf.PregnancyParaCount
        name: PregnancyParaCount
        type: INT
        nullable: true

      - source: pf.PregnancyPretermCount
        name: PregnancyPretermCount
        type: INT
        nullable: true

      - source: pf.PregnancyTermCount
