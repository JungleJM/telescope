  # 10. Maternal Patient Info
  - name: MotherOfPatient
    type: fact
    pull_this_cycle: true
    dedup_key: [DurableKey]
    dest_table: MotherOfPatient
    columns:
      - source: p.DurableKey
        name: DurableKey
        type: BIGINT
        nullable: false

      - source: p.BirthDate
        name: BirthDate
        type: DATE
        nullable: true

      - source: p.Sex
        name: Sex
        type: VARCHAR(50)
        nullable: true

      - source: p.PreferredLanguage
        name: PreferredLanguage
        type: NVARCHAR(300)
        nullable: true

      - source: p.FirstRace
        name: FirstRace
        type: VARCHAR(100)
        nullable: true

      - source: p.SecondRace
        name: SecondRace
        type: VARCHAR(100)
        nullable: true

      - source: p.ThirdRace
        name: ThirdRace
