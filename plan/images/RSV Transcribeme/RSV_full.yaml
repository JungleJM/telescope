      - source: p.SviRacialEthnicMinorityStatusPctlRankByZip2020_X
        name: SviRacialEthnicMinorityStatusPctlRankByZip2020_X
        type: FLOAT
        nullable: true

    filter:
      from:
        - PatientDim AS p
      join:
        - "INNER JOIN {{prefix}}_ChildBirthEvents AS cb ON cb.MotherPatientDurableKey = p.DurableKey"
      where:
        - "p.IsValid = 1"
        - "p.IsCurrent = 1"
        - "p.UseInCosmosAnalytics_X = 1"
