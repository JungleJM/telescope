blueprint:
  from_template: Infant_RSV_Followup_intake.yaml
cosmos_vars:
  project_db: auto
  cosmos_db: Dual
run_vars:
  min_date_key: '20181201'
  max_date_key: 20260701
test_options:
  smallset: false
  stop_at_for_pk_table: 10
  random_pk_sample: false
project_vars:
  project_folder: Infant_RSV_Followup
vars: {}
upload_cohorts:
- name: RSVVisitKeys
  dest_table: RSVVisitKeys
  type: pk
  file_type: parquet
  file_loc: rsv_visit_keys.parquet
  key_columns:
  - EdVisitKey
  description: Infant_RSV's ED visits, written by `python rsv keys` from its EDVisits.parquet
  columns:
  - name: EdVisitKey
    type: BIGINT
  - name: EncounterKey
    type: BIGINT
  - name: PatientDurableKey
    type: BIGINT
  - name: HospitalAdmissionKey
    type: BIGINT
  - name: ArrivalInstant
    type: DATETIME2
  - name: DepartureInstant
    type: DATETIME2
  awaiting_file: true
  push_this_cycle: true
multipliers: []
batching:
- name: chunk
  kind: row_chunk
  rows_per_batch: 200000
  applies_to: PKTable
cohorts:
- name: Patients
  dest_table: Patients
  type: fact
  pull_this_cycle: true
  description: 'Each visit''s patient: birth date, sex, race, ethnicity, SVI'
  granularity: One row per patient
  columns:
  - source: pd.DurableKey
    name: DurableKey
    type: BIGINT
  - source: pd.BirthDate
    name: BirthDate
    type: DATE
  - source: pd.DeathDate
    name: DeathDate
    type: DATE
  - source: pd.Sex
    name: Sex
    type: NVARCHAR(300)
  - source: pd.SexAssignedAtBirth
    name: SexAssignedAtBirth
    type: NVARCHAR(300)
  - source: pd.FirstRace
    name: FirstRace
    type: NVARCHAR(300)
  - source: pd.SecondRace
    name: SecondRace
    type: NVARCHAR(300)
  - source: pd.MultiRacial
    name: MultiRacial
    type: TINYINT
  - source: pd.Ethnicity
    name: Ethnicity
    type: NVARCHAR(300)
  - source: pd.PreferredLanguage
    name: PreferredLanguage
    type: NVARCHAR(300)
  - source: pd.StateOrProvinceAbbreviation
    name: StateOrProvinceAbbreviation
    type: NVARCHAR(300)
  - source: pd.PrimaryRUCA_X
    name: PrimaryRUCA_X
    type: NVARCHAR(50)
  - source: pd.SviOverallPctlRankByZip2020_X
    name: SviOverallPctlRankByZip2020_X
    type: NUMERIC(6,4)
  - source: pd.SviSocioeconomicPctlRankByZip2020_X
    name: SviSocioeconomicPctlRankByZip2020_X
    type: NUMERIC(6,4)
  - source: pd.SviHouseholdCharacteristicsPctlRankByZip2020_X
    name: SviHouseholdCharacteristicsPctlRankByZip2020_X
    type: NUMERIC(6,4)
  - source: pd.SviRacialEthnicMinorityStatusPctlRankByZip2020_X
    name: SviRacialEthnicMinorityStatusPctlRankByZip2020_X
    type: NUMERIC(6,4)
  - source: pd.SviHousingTypeTransportationPctlRankByZip2020_X
    name: SviHousingTypeTransportationPctlRankByZip2020_X
    type: NUMERIC(6,4)
  filter:
    from:
    - PatientDim AS pd
    join:
    - INNER JOIN {{prefix}}_RSVVisitKeys AS pk ON pk.PatientDurableKey = pd.DurableKey
    where:
    - pd.IsValid = 1
    - pd.IsCurrent = 1
    - pd.UseInCosmosAnalytics_X = 1
    - pd._IsDeleted = 0
  dedup_keys:
  - - DurableKey
- name: EDVitals
  dest_table: EDVitals
  type: fact
  pull_this_cycle: true
  description: Vitals on the visit's encounter, a day either side of the ED stay
  granularity: One row per vitals reading
  columns:
  - source: vf.VitalsKey
    name: VitalsKey
    type: BIGINT
  - source: vf.EncounterKey
    name: EncounterKey
    type: BIGINT
  - source: vf.PatientDurableKey
    name: PatientDurableKey
    type: BIGINT
  - source: vf.TakenInstant
    name: TakenInstant
    type: DATETIME2(7)
  - source: vf.RespirationRate
    name: RespirationRate
    type: INT
  - source: vf.SpO2
    name: SpO2
    type: INT
  - source: vf.Temperature
    name: Temperature
    type: NUMERIC(18,2)
  - source: vf.PulseRate
    name: PulseRate
    type: INT
  - source: vf.Weight
    name: Weight
    type: NUMERIC(18,2)
  filter:
    from:
    - VitalsFact AS vf
    join:
    - INNER JOIN {{prefix}}_RSVVisitKeys AS pk ON pk.EncounterKey = vf.EncounterKey
      AND pk.PatientDurableKey = vf.PatientDurableKey
    where:
    - vf._IsDeleted = 0
    - vf.DateKey BETWEEN {{min_date_key}} AND {{max_date_key}}
    - vf.TakenInstant BETWEEN DATEADD(DAY, -1, pk.ArrivalInstant) AND DATEADD(DAY,
      1, pk.DepartureInstant)
- name: EDLabs
  dest_table: EDLabs
  type: fact
  pull_this_cycle: true
  description: Lab components on the visit's encounter, a day either side of the ED
    stay, with the component's names
  granularity: One row per lab component result
  columns:
  - source: lcrf.LabComponentResultKey
    name: LabComponentResultKey
    type: BIGINT
  - source: lcrf.EncounterKey
    name: EncounterKey
    type: BIGINT
  - source: lcrf.PatientDurableKey
    name: PatientDurableKey
    type: BIGINT
  - source: lcrf.LabComponentKey
    name: LabComponentKey
    type: BIGINT
  - source: lcrf.CollectionInstant
    name: CollectionInstant
    type: DATETIME2(7)
  - source: lcrf.NumericValue
    name: NumericValue
    type: FLOAT
  - source: lcrf.Value
    name: Value
    type: NVARCHAR(300)
  - source: lcrf.Unit
    name: Unit
    type: NVARCHAR(100)
  - source: lcrf.Abnormal
    name: Abnormal
    type: TINYINT
  - source: lcrf.Flag
    name: Flag
    type: NVARCHAR(300)
  - source: lcd.LoincCode
    name: ComponentLoincCode
    type: NVARCHAR(300)
  - source: lcd.LoincName
    name: ComponentLoincName
    type: NVARCHAR(550)
  - source: lcd.Name
    name: ComponentName
    type: NVARCHAR(300)
  - source: lcd.CommonName
    name: ComponentCommonName
    type: NVARCHAR(300)
  - source: lcd.BaseName
    name: ComponentBaseName
    type: NVARCHAR(100)
  filter:
    from:
    - LabComponentResultFact AS lcrf
    join:
    - INNER JOIN {{prefix}}_RSVVisitKeys AS pk ON pk.EncounterKey = lcrf.EncounterKey
      AND pk.PatientDurableKey = lcrf.PatientDurableKey
    - INNER JOIN LabComponentDim AS lcd ON lcd.LabComponentKey = lcrf.LabComponentKey
    where:
    - lcrf._IsDeleted = 0
    - lcrf.PrioritizedDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}
    - lcrf.CollectionInstant BETWEEN DATEADD(DAY, -1, pk.ArrivalInstant) AND DATEADD(DAY,
      1, pk.DepartureInstant)
- name: EDDiagnoses
  dest_table: EDDiagnoses
  type: fact
  pull_this_cycle: true
  description: Every ICD-10 diagnosis on the visit's encounter (the RSV codes, and
    anything beside them)
  granularity: One row per diagnosis event and code
  columns:
  - source: def.DiagnosisEventKey
    name: DiagnosisEventKey
    type: BIGINT
  - source: def.EncounterKey
    name: EncounterKey
    type: BIGINT
  - source: def.PatientDurableKey
    name: PatientDurableKey
    type: BIGINT
  - source: def.DiagnosisKey
    name: DiagnosisKey
    type: BIGINT
  - source: def.EmergencyDepartmentDiagnosis
    name: EmergencyDepartmentDiagnosis
    type: TINYINT
  - source: def.IsPrimary
    name: IsPrimary
    type: TINYINT
  - source: def.Type
    name: Type
    type: NVARCHAR(350)
  - source: dt.Value
    name: BillingCodeValue
    type: NVARCHAR(300)
  - source: dt.Type
    name: CodeType
    type: NVARCHAR(300)
  filter:
    from:
    - DiagnosisEventFact AS def
    join:
    - INNER JOIN {{prefix}}_RSVVisitKeys AS pk ON pk.EncounterKey = def.EncounterKey
      AND pk.PatientDurableKey = def.PatientDurableKey
    - INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = def.DiagnosisKey
    where:
    - def._IsDeleted = 0
    - dt._IsDeleted = 0
    - def.StartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}
    - dt.Type IN ('ICD-10-AM', 'ICD-10-CA', 'ICD-10-CM')
  dedup_keys:
  - - DiagnosisEventKey
    - BillingCodeValue
- name: Births
  dest_table: Births
  type: fact
  pull_this_cycle: true
  description: 'Each child''s birth, whenever it was: gestational age, birth weight'
  granularity: One row per baby
  columns:
  - source: bf.BabyPatientDurableKey
    name: BabyPatientDurableKey
    type: BIGINT
  - source: bf.BirthKey
    name: BirthKey
    type: BIGINT
  - source: bf.BirthInstant
    name: BirthInstant
    type: DATETIME2(7)
  - source: bf.BirthDateKey
    name: BirthDateKey
    type: BIGINT
  - source: bf.GestationalAgeDays
    name: GestationalAgeDays
    type: INT
  - source: bf.BirthWeightGrams
    name: BirthWeightGrams
    type: NUMERIC(10,3)
  - source: bf.BirthLength
    name: BirthLength
    type: NUMERIC(8,3)
  - source: bf.MultipleDeliveryCount
    name: MultipleDeliveryCount
    type: TINYINT
  - source: bf.MultipleDeliveryOrder
    name: MultipleDeliveryOrder
    type: TINYINT
  - source: bf.DeliveryMethod
    name: DeliveryMethod
    type: NVARCHAR(300)
  - source: bf.TotalApgarFiveMinute
    name: TotalApgarFiveMinute
    type: TINYINT
  - source: bf.BabyInpatientLengthOfStayInDays
    name: BabyInpatientLengthOfStayInDays
    type: SMALLINT
  - source: bf.NeonatalDemise
    name: NeonatalDemise
    type: TINYINT
  - source: bf.MotherPatientDurableKey
    name: MotherPatientDurableKey
    type: BIGINT
  - source: bf.PregnancyKey
    name: PregnancyKey
    type: BIGINT
  filter:
    from:
    - BirthFact AS bf
    join:
    - INNER JOIN {{prefix}}_RSVVisitKeys AS pk ON pk.PatientDurableKey = bf.BabyPatientDurableKey
    where:
    - bf._IsDeleted = 0
  dedup_keys:
  - - BabyPatientDurableKey
  dedup_order_by:
  - BirthKey
- name: EDMeds
  dest_table: EDMeds
  type: fact
  pull_this_cycle: true
  description: Medication administrations on the visit's encounter, a day either side
    of the ED stay, with the medication's names (IV fluids)
  granularity: One row per administration
  columns:
  - source: maf.MedicationAdministrationKey
    name: MedicationAdministrationKey
    type: BIGINT
  - source: maf.EncounterKey
    name: EncounterKey
    type: BIGINT
  - source: maf.PatientDurableKey
    name: PatientDurableKey
    type: BIGINT
  - source: maf.AdministrationInstant
    name: AdministrationInstant
    type: DATETIME2(7)
  - source: maf.AdministrationRoute
    name: AdministrationRoute
    type: NVARCHAR(300)
  - source: maf.AdministrationAction
    name: AdministrationAction
    type: NVARCHAR(300)
  - source: maf.ActionIsMedAdministration
    name: ActionIsMedAdministration
    type: TINYINT
  - source: maf.MedicationKey
    name: MedicationKey
    type: BIGINT
  - source: maf.MedicationOrderKey
    name: MedicationOrderKey
    type: BIGINT
  - source: maf.Dose
    name: Dose
    type: NVARCHAR(200)
  - source: maf.DoseUnit
    name: DoseUnit
    type: NVARCHAR(300)
  - source: maf.Rate
    name: Rate
    type: NVARCHAR(50)
  - source: maf.AdministrationDepartmentKey
    name: AdministrationDepartmentKey
    type: BIGINT
  - source: md.Name
    name: MedicationName
    type: NVARCHAR(300)
  - source: md.GenericName
    name: MedicationGenericName
    type: NVARCHAR(200)
  - source: md.SimpleGenericName
    name: MedicationSimpleGenericName
    type: NVARCHAR(300)
  - source: md.PharmaceuticalClass
    name: MedicationPharmaceuticalClass
    type: NVARCHAR(300)
  - source: md.PharmaceuticalSubclass
    name: MedicationPharmaceuticalSubclass
    type: NVARCHAR(300)
  - source: md.TherapeuticClass
    name: MedicationTherapeuticClass
    type: NVARCHAR(300)
  - source: md.Form
    name: MedicationForm
    type: NVARCHAR(300)
  - source: md.Route
    name: MedicationRoute
    type: NVARCHAR(300)
  filter:
    from:
    - MedicationAdministrationFact AS maf
    join:
    - INNER JOIN {{prefix}}_RSVVisitKeys AS pk ON pk.EncounterKey = maf.EncounterKey
      AND pk.PatientDurableKey = maf.PatientDurableKey
    - LEFT JOIN MedicationDim AS md ON md.MedicationKey = maf.MedicationKey
    where:
    - maf._IsDeleted = 0
    - maf.AdministrationDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}
    - maf.AdministrationInstant BETWEEN DATEADD(DAY, -1, pk.ArrivalInstant) AND DATEADD(DAY,
      1, pk.DepartureInstant)
- name: StayDepartments
  dest_table: StayDepartments
  type: fact
  pull_this_cycle: true
  description: Each department a medication was given in during the admission, with
    its specialty and the first time (ICU transfers mid-stay)
  granularity: One row per admission and department
  columns:
  - source: haf.HospitalAdmissionKey
    name: HospitalAdmissionKey
    type: BIGINT
  - source: maf.AdministrationDepartmentKey
    name: AdministrationDepartmentKey
    type: BIGINT
  - source: dept.DepartmentSpecialty
    name: DepartmentSpecialty
    type: NVARCHAR(300)
  - source: maf.AdministrationInstant
    name: AdministrationInstant
    type: DATETIME2(7)
  filter:
    from:
    - MedicationAdministrationFact AS maf
    join:
    - INNER JOIN HospitalAdmissionFact AS haf ON haf.EncounterKey = maf.EncounterKey
    - INNER JOIN {{prefix}}_RSVVisitKeys AS pk ON pk.HospitalAdmissionKey = haf.HospitalAdmissionKey
    - INNER JOIN DepartmentDim AS dept ON dept.DepartmentKey = maf.AdministrationDepartmentKey
    where:
    - maf._IsDeleted = 0
    - haf._IsDeleted = 0
    - pk.HospitalAdmissionKey > 0
    - maf.AdministrationDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}
    - haf.AdmissionDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}
    - maf.AdministrationInstant BETWEEN haf.InpatientAdmissionInstant AND haf.DischargeInstant
  dedup_keys:
  - - HospitalAdmissionKey
    - AdministrationDepartmentKey
  dedup_order_by:
  - AdministrationInstant
- name: IcuStays
  dest_table: IcuStays
  type: fact
  pull_this_cycle: true
  description: Each admission's ICU stays, from Cosmos's ICU Stay Registry, with the
    specialty of the department each began in
  granularity: One row per ICU stay and admission
  columns:
  - source: r.IcuStayRegistryKey
    name: IcuStayRegistryKey
    type: BIGINT
  - source: haf.HospitalAdmissionKey
    name: HospitalAdmissionKey
    type: BIGINT
  - source: pk.EdVisitKey
    name: EdVisitKey
    type: BIGINT
  - source: r.EncounterKey
    name: IcuEncounterKey
    type: BIGINT
  - source: haf.EncounterKey
    name: AdmissionEncounterKey
    type: BIGINT
  - source: r.PatientDurableKey
    name: PatientDurableKey
    type: BIGINT
  - source: r.DepartmentKey
    name: DepartmentKey
    type: BIGINT
  - source: d.DepartmentSpecialty
    name: IcuSpecialty
    type: NVARCHAR(300)
  - source: r.IcuStayStartInstant
    name: IcuStayStartInstant
    type: DATETIME2(7)
  - source: r.IcuStayEndInstant
    name: IcuStayEndInstant
    type: DATETIME2(7)
  - source: r.IcuLengthOfStay
    name: IcuLengthOfStay
    type: NUMERIC(18,2)
  - source: r.AgeAtIcuStayStart
    name: AgeAtIcuStayStart
    type: NUMERIC(18,2)
  filter:
    from:
    - IcuStayRegistryDataMart AS r
    join:
    - INNER JOIN {{prefix}}_RSVVisitKeys AS pk ON pk.PatientDurableKey = r.PatientDurableKey
    - INNER JOIN HospitalAdmissionFact AS haf ON haf.HospitalAdmissionKey = pk.HospitalAdmissionKey
    - LEFT JOIN DepartmentDim AS d ON d.DepartmentKey = r.DepartmentKey
    where:
    - r._IsDeleted = 0
    - haf._IsDeleted = 0
    - pk.HospitalAdmissionKey > 0
    - haf.AdmissionDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}
    - r.IcuStayStartInstant BETWEEN DATEADD(DAY, -1, haf.InpatientAdmissionInstant)
      AND haf.DischargeInstant
  dedup_keys:
  - - IcuStayRegistryKey
    - HospitalAdmissionKey
- name: AdmissionDepartments
  dest_table: AdmissionDepartments
  type: fact
  pull_this_cycle: true
  description: Each admitted visit's admission, with the specialty of the department
    it was admitted to and discharged from (ICU)
  granularity: One row per admission
  columns:
  - source: haf.HospitalAdmissionKey
    name: HospitalAdmissionKey
    type: BIGINT
  - source: haf.EncounterKey
    name: EncounterKey
    type: BIGINT
  - source: haf.PatientDurableKey
    name: PatientDurableKey
    type: BIGINT
  - source: haf.InpatientAdmissionInstant
    name: InpatientAdmissionInstant
    type: DATETIME2(7)
  - source: haf.DischargeInstant
    name: DischargeInstant
    type: DATETIME2(7)
  - source: haf.LengthOfStayInDays
    name: LengthOfStayInDays
    type: SMALLINT
  - source: haf.DepartmentKey
    name: DepartmentKey
    type: BIGINT
  - source: haf.DischargeDepartmentKey_X
    name: DischargeDepartmentKey_X
    type: BIGINT
  - source: ad.DepartmentSpecialty
    name: AdmitSpecialty
    type: NVARCHAR(300)
  - source: dd.DepartmentSpecialty
    name: DischargeSpecialty
    type: NVARCHAR(300)
  filter:
    from:
    - HospitalAdmissionFact AS haf
    join:
    - INNER JOIN {{prefix}}_RSVVisitKeys AS pk ON pk.HospitalAdmissionKey = haf.HospitalAdmissionKey
    - LEFT JOIN DepartmentDim AS ad ON ad.DepartmentKey = haf.DepartmentKey
    - LEFT JOIN DepartmentDim AS dd ON dd.DepartmentKey = haf.DischargeDepartmentKey_X
    where:
    - haf._IsDeleted = 0
    - pk.HospitalAdmissionKey > 0
    - haf.AdmissionDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}
  dedup_keys:
  - - HospitalAdmissionKey
