    nullable: true
    type: DATETIME2(7)
  - source: evf.DispositionTimeOfDayKey
    name: DispositionTimeOfDayKey
    nullable: true
    type: BIGINT
  - source: evf.EdVisitKey
    name: EdVisitKey
    nullable: false
    type: BIGINT
  - source: evf.EdGenericDispo
    name: EdGenericDispo
    nullable: true
