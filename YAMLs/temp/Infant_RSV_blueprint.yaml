blueprint:
  from_template: Infant_RSV_intake.yaml
cosmos_vars:
  project_db: auto
  cosmos_db: Dual
run_vars:
  min_date_key: '20190101'
  max_date_key: 20260601
test_options:
  smallset: false
  stop_at_for_pk_table: 10
  random_pk_sample: false
project_vars:
  project_folder: Infant RSV
vars: {}
upload_cohorts: []
multipliers: []
batching:
- name: chunk
  kind: row_chunk
  rows_per_batch: 200000
  applies_to: PKTable
cohorts:
- name: EDVisits
  dest_table: EDVisits
  type: PK
  pull_this_cycle: true
  description: Every visit to ED with a diagnosis of RSV for a child 2 years or less
  granularity: One row per ED visit (EdVisitKey)
  columns:
  - source: evf.AcuityLevel
    name: AcuityLevel
    nullable: true
    type: NVARCHAR(300)
  - source: evf.AdmissionProviderDurableKey
    name: AdmissionProviderDurableKey
    nullable: true
    type: BIGINT
  - source: evf.AgeKey
    name: AgeKey
    nullable: true
    type: BIGINT
  - source: evf.ArrivalDateKey
    name: ArrivalDateKey
    nullable: false
    type: BIGINT
  - source: evf.ArrivalInstant
    name: ArrivalInstant
    nullable: false
    type: DATETIME2(7)
