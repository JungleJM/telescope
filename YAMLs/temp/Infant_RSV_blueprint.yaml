  filter:
    from:
    - EdVisitFact as evf
    join:
    - "INNER JOIN DurationDim AS age ON age.DurationKey = evf.AgeKey"
    - "INNER JOIN DiagnosisEventFact AS d ON d.EncounterKey = evf.EncounterKey AND\
      \ d.PatientDurableKey = evf.PatientDurableKey"
    - "INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = d.DiagnosisKey"
    where:
    - "age.Years < 2"
    - "d._IsDeleted = 0"
    - "dt._IsDeleted = 0"
    - "evf.ArrivalDateKey >= 0"
    - "evf.ArrivalDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
    - "d.EmergencyDepartmentDiagnosis = 1"
    - "dt.Type IN ('ICD-10-AM', 'ICD-10-CA', 'ICD-10-CM')"
    - "{{sql_condition('dt.Value', ICD_Value)}}"
    - "evf._IsDeleted = 0"
  dedup_keys:
  - - EdVisitKey
  dedup_order_by:
  - ArrivalDateKey
  vars:
    ICD_Value:
    - J12.1
    - B97.4
    - J21.0
    - J20.5
