  - source: evf.FirstAttendingAssignedTimeOfDayKey
    name: FirstAttendingAssignedTimeOfDayKey
    nullable: true
    type: BIGINT
  - source: evf.FirstCodeEndDateKey
    name: FirstCodeEndDateKey
    nullable: true
    type: BIGINT
  - source: evf.FirstCodeEndInstant
    name: FirstCodeEndInstant
    nullable: true
    type: DATETIME2(7)
  - source: evf.FirstCodeEndTimeOfDayKey
    name: FirstCodeEndTimeOfDayKey
    nullable: true
    type: BIGINT
  - source: evf.FirstCodeStartDateKey
    name: FirstCodeStartDateKey
    nullable: true
    type: BIGINT
  - source: evf.FirstCodeStartInstant
    name: FirstCodeStartInstant
    nullable: true
    type: DATETIME2(7)
  - source: evf.FirstCodeStartTimeOfDayKey
    name: FirstCodeStartTimeOfDayKey
    nullable: true
    type: BIGINT
  - source: evf.FirstEdRegisteredNurseAssignedDateKey
    name: FirstEdRegisteredNurseAssignedDateKey
    nullable: true
    type: BIGINT
  - source: evf.FirstEdRegisteredNurseAssignedInstant
    name: FirstEdRegisteredNurseAssignedInstant
    nullable: true
    type: DATETIME2(7)
  - source: evf.FirstEdRegisteredNurseAssignedTimeOfDayKey
    name: FirstEdRegisteredNurseAssignedTimeOfDayKey
    nullable: true
    type: BIGINT
  - source: evf.FirstProviderContactDateKey
    name: FirstProviderContactDateKey
    nullable: true
    type: BIGINT
  - source: evf.FirstProviderContactInstant
    name: FirstProviderContactInstant
    nullable: true
    type: DATETIME2(7)
  - source: evf.FirstProviderContactTimeOfDayKey
    name: FirstProviderContactTimeOfDayKey
    nullable: true
    type: BIGINT
  - source: evf.FirstTraumaEndDateKey
    name: FirstTraumaEndDateKey
