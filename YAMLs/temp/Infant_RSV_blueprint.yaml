  - source: evf.HospitalAdmissionKey
    name: HospitalAdmissionKey
    nullable: true
    type: BIGINT
  - source: evf.LeftAgainstMedicalAdvice
    name: LeftAgainstMedicalAdvice
    nullable: true
    type: TINYINT
  - source: evf.LeftWithoutBeingSeen
    name: LeftWithoutBeingSeen
    nullable: true
    type: TINYINT
  - source: evf.PatientDurableKey
    name: PatientDurableKey
    nullable: false
    type: BIGINT
  - source: evf.PayorComboKey_X
    name: PayorComboKey_X
    nullable: true
    type: BIGINT
  - source: evf.PrimaryPayorKey_X
    name: PrimaryPayorKey_X
    nullable: true
    type: BIGINT
  - source: evf.RoomedDateKey
    name: RoomedDateKey
    nullable: true
    type: BIGINT
  - source: evf.RoomedInstant
    name: RoomedInstant
    nullable: true
    type: DATETIME2(7)
  - source: evf.RoomedTimeOfDayKey
    name: RoomedTimeOfDayKey
    nullable: true
    type: BIGINT
  - source: evf.AvsPrintDateKey
    name: AvsPrintDateKey
    nullable: true
    type: BIGINT
  - source: evf.FirstEkgCompletedDateKey
    name: FirstEkgCompletedDateKey
    nullable: true
    type: BIGINT
  - source: evf.FirstEkgCompletedInstant
    name: FirstEkgCompletedInstant
    nullable: true
    type: DATETIME2(7)
  - source: evf.FirstEkgCompletedTimeOfDayKey
    name: FirstEkgCompletedTimeOfDayKey
    nullable: true
    type: BIGINT
  - source: evf.FirstSedationEndDateKey
    name: FirstSedationEndDateKey
    nullable: true
    type: BIGINT
  - source: evf.FirstSedationEndInstant
    name: FirstSedationEndInstant
    nullable: true
    type: DATETIME2(7)
  - source: evf.FirstSedationEndTimeOfDayKey
    name: FirstSedationEndTimeOfDayKey
    nullable: true
    type: BIGINT
  - source: evf.FirstSedationStartDateKey
    name: FirstSedationStartDateKey
    nullable: true
    type: BIGINT
  - source: evf.FirstSedationStartInstant
    name: FirstSedationStartInstant
    nullable: true
    type: DATETIME2(7)
  - source: evf.FirstSedationStartTimeOfDayKey
    name: FirstSedationStartTimeOfDayKey
    nullable: true
    type: BIGINT
  - source: evf.ObservationStartedDateKey
    name: ObservationStartedDateKey
    nullable: true
    type: BIGINT
  - source: evf.ObservationStartedInstant
    name: ObservationStartedInstant
    nullable: true
    type: DATETIME2(7)
  - source: evf.ObservationStartedTimeOfDayKey
    name: ObservationStartedTimeOfDayKey
    nullable: true
    type: BIGINT
  - source: evf.RegistrationCompleteDateKey
    name: RegistrationCompleteDateKey
    nullable: true
    type: BIGINT
  - source: evf.RegistrationCompleteInstant
    name: RegistrationCompleteInstant
    nullable: true
    type: DATETIME2(7)
  - source: evf.RegistrationCompleteTimeOfDayKey
    name: RegistrationCompleteTimeOfDayKey
    nullable: true
    type: BIGINT
  - source: evf.TriageCompleteDateKey
    name: TriageCompleteDateKey
    nullable: true
    type: BIGINT
  - source: evf.TriageCompleteInstant
    name: TriageCompleteInstant
    nullable: true
    type: DATETIME2(7)
  - source: evf.TriageCompleteTimeOfDayKey
    name: TriageCompleteTimeOfDayKey
    nullable: true
    type: BIGINT
  - source: evf.TriageStartDateKey
    name: TriageStartDateKey
    nullable: true
    type: BIGINT
  - source: evf.TriageStartInstant
    name: TriageStartInstant
    nullable: true
    type: DATETIME2(7)
  - source: evf.TriageStartTimeOfDayKey
    name: TriageStartTimeOfDayKey
    nullable: true
    type: BIGINT
  - source: evf.UnderObservation
    name: UnderObservation
    nullable: true
    type: TINYINT
  filter:
    from:
    - EdVisitFact as evf
    join:
    - INNER JOIN DurationDim AS age ON age.DurationKey = evf.AgeKey
    - INNER JOIN DiagnosisEventFact AS d ON d.EncounterKey = evf.EncounterKey AND
      d.PatientDurableKey = evf.PatientDurableKey
    - INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = d.DiagnosisKey
    where:
    - age.Years < 2
    - d._IsDeleted = 0
    - dt._IsDeleted = 0
    - evf.ArrivalDateKey >= 0
    - evf.ArrivalDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}
    - d.EmergencyDepartmentDiagnosis = 1
    - dt.Type IN ('ICD-10-AM', 'ICD-10-CA', 'ICD-10-CM')
    - '{{sql_condition(''dt.Value'', ICD_Value)}}'
    - evf._IsDeleted = 0
  dedup_keys:
  - - EdVisitKey
  dedup_order_by:
  - ArrivalDateKey
  vars:
    ICD_Value:
    - J12.1
    - B97.4
    - J21.0
    - J20.5
- name: Patients
  dest_table: Patients
  type: fact
  pull_this_cycle: true
  description: 'Each visit''s patient: birth date, sex, race, ethnicity, SVI'
  granularity: One row per patient
  columns:
  - source: pd.DurableKey
    name: DurableKey
    type: BIGINT
  - source: pd.BirthDate
    name: BirthDate
    type: DATE
  - source: pd.DeathDate
    name: DeathDate
    type: DATE
  - source: pd.Sex
    name: Sex
    type: NVARCHAR(300)
  - source: pd.SexAssignedAtBirth
    name: SexAssignedAtBirth
    type: NVARCHAR(300)
  - source: pd.FirstRace
    name: FirstRace
    type: NVARCHAR(300)
  - source: pd.SecondRace
    name: SecondRace
    type: NVARCHAR(300)
  - source: pd.MultiRacial
    name: MultiRacial
    type: TINYINT
  - source: pd.Ethnicity
    name: Ethnicity
    type: NVARCHAR(300)
  - source: pd.PreferredLanguage
    name: PreferredLanguage
    type: NVARCHAR(300)
  - source: pd.StateOrProvinceAbbreviation
    name: StateOrProvinceAbbreviation
    type: NVARCHAR(300)
  - source: pd.PrimaryRUCA_X
    name: PrimaryRUCA_X
    type: NVARCHAR(50)
  - source: pd.SviOverallPctlRankByZip2020_X
    name: SviOverallPctlRankByZip2020_X
    type: NUMERIC(6,4)
  - source: pd.SviSocioeconomicPctlRankByZip2020_X
    name: SviSocioeconomicPctlRankByZip2020_X
    type: NUMERIC(6,4)
  - source: pd.SviHouseholdCharacteristicsPctlRankByZip2020_X
    name: SviHouseholdCharacteristicsPctlRankByZip2020_X
    type: NUMERIC(6,4)
  - source: pd.SviRacialEthnicMinorityStatusPctlRankByZip2020_X
    name: SviRacialEthnicMinorityStatusPctlRankByZip2020_X
    type: NUMERIC(6,4)
  - source: pd.SviHousingTypeTransportationPctlRankByZip2020_X
    name: SviHousingTypeTransportationPctlRankByZip2020_X
    type: NUMERIC(6,4)
  filter:
    from:
    - PatientDim AS pd
    join:
    - INNER JOIN {{prefix}}_EDVisits AS pk ON pk.PatientDurableKey = pd.DurableKey
    where:
    - pd.IsValid = 1
    - pd.IsCurrent = 1
    - pd.UseInCosmosAnalytics_X = 1
    - pd._IsDeleted = 0
  dedup_keys:
  - - DurableKey
- name: EDVitals
  dest_table: EDVitals
  type: fact
  pull_this_cycle: true
  description: Vitals on the visit's encounter, a day either side of the ED stay
  granularity: One row per vitals reading
  columns:
  - source: vf.VitalsKey
    name: VitalsKey
    type: BIGINT
  - source: vf.EncounterKey
    name: EncounterKey
    type: BIGINT
  - source: vf.PatientDurableKey
    name: PatientDurableKey
    type: BIGINT
  - source: vf.TakenInstant
    name: TakenInstant
    type: DATETIME2(7)
  - source: vf.RespirationRate
    name: RespirationRate
    type: INT
  - source: vf.SpO2
    name: SpO2
    type: INT
  - source: vf.Temperature
    name: Temperature
    type: NUMERIC(18,2)
  - source: vf.PulseRate
    name: PulseRate
    type: INT
  - source: vf.Weight
    name: Weight
    type: NUMERIC(18,2)
  filter:
    from:
    - VitalsFact AS vf
    join:
    - INNER JOIN {{prefix}}_EDVisits AS pk ON pk.EncounterKey = vf.EncounterKey AND
      pk.PatientDurableKey = vf.PatientDurableKey
    where:
    - vf._IsDeleted = 0
    - vf.DateKey BETWEEN {{min_date_key}} AND {{max_date_key}}
    - vf.TakenInstant BETWEEN DATEADD(DAY, -1, pk.ArrivalInstant) AND DATEADD(DAY,
      1, pk.DepartureInstant)
- name: EDLabs
  dest_table: EDLabs
  type: fact
  pull_this_cycle: true
  description: Lab components on the visit's encounter, a day either side of the ED
    stay, with the component's names
  granularity: One row per lab component result
  columns:
  - source: lcrf.LabComponentResultKey
    name: LabComponentResultKey
    type: BIGINT
  - source: lcrf.EncounterKey
    name: EncounterKey
    type: BIGINT
  - source: lcrf.PatientDurableKey
    name: PatientDurableKey
    type: BIGINT
  - source: lcrf.LabComponentKey
    name: LabComponentKey
    type: BIGINT
  - source: lcrf.CollectionInstant
    name: CollectionInstant
    type: DATETIME2(7)
  - source: lcrf.NumericValue
    name: NumericValue
    type: FLOAT
  - source: lcrf.Value
    name: Value
    type: NVARCHAR(300)
  - source: lcrf.Unit
    name: Unit
    type: NVARCHAR(100)
  - source: lcrf.Abnormal
    name: Abnormal
    type: TINYINT
  - source: lcrf.Flag
    name: Flag
    type: NVARCHAR(300)
  - source: lcd.LoincCode
    name: ComponentLoincCode
    type: NVARCHAR(300)
  - source: lcd.LoincName
    name: ComponentLoincName
    type: NVARCHAR(550)
  - source: lcd.Name
    name: ComponentName
    type: NVARCHAR(300)
  - source: lcd.CommonName
    name: ComponentCommonName
    type: NVARCHAR(300)
  - source: lcd.BaseName
    name: ComponentBaseName
    type: NVARCHAR(100)
  filter:
    from:
    - LabComponentResultFact AS lcrf
    join:
    - INNER JOIN {{prefix}}_EDVisits AS pk ON pk.EncounterKey = lcrf.EncounterKey
      AND pk.PatientDurableKey = lcrf.PatientDurableKey
    - INNER JOIN LabComponentDim AS lcd ON lcd.LabComponentKey = lcrf.LabComponentKey
    where:
    - lcrf._IsDeleted = 0
    - lcrf.PrioritizedDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}
    - lcrf.CollectionInstant BETWEEN DATEADD(DAY, -1, pk.ArrivalInstant) AND DATEADD(DAY,
      1, pk.DepartureInstant)
- name: EDDiagnoses
  dest_table: EDDiagnoses
  type: fact
  pull_this_cycle: true
  description: Every ICD-10 diagnosis on the visit's encounter (the RSV codes, and
    anything beside them)
  granularity: One row per diagnosis event and code
  columns:
  - source: def.DiagnosisEventKey
    name: DiagnosisEventKey
    type: BIGINT
  - source: def.EncounterKey
    name: EncounterKey
    type: BIGINT
  - source: def.PatientDurableKey
    name: PatientDurableKey
    type: BIGINT
  - source: def.DiagnosisKey
    name: DiagnosisKey
    type: BIGINT
  - source: def.EmergencyDepartmentDiagnosis
    name: EmergencyDepartmentDiagnosis
    type: TINYINT
  - source: def.IsPrimary
    name: IsPrimary
    type: TINYINT
  - source: def.Type
    name: Type
    type: NVARCHAR(350)
  - source: dt.Value
    name: BillingCodeValue
    type: NVARCHAR(300)
  - source: dt.Type
    name: CodeType
    type: NVARCHAR(300)
  filter:
    from:
    - DiagnosisEventFact AS def
    join:
    - INNER JOIN {{prefix}}_EDVisits AS pk ON pk.EncounterKey = def.EncounterKey AND
      pk.PatientDurableKey = def.PatientDurableKey
    - INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = def.DiagnosisKey
    where:
    - def._IsDeleted = 0
    - dt._IsDeleted = 0
    - def.StartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}
    - dt.Type IN ('ICD-10-AM', 'ICD-10-CA', 'ICD-10-CM')
  dedup_keys:
  - - DiagnosisEventKey
    - BillingCodeValue
- name: EDMeds
  dest_table: EDMeds
  type: fact
  pull_this_cycle: true
  description: Medication administrations on the visit's encounter, a day either side
    of the ED stay, with the medication's names (IV fluids)
  granularity: One row per administration
  columns:
  - source: maf.MedicationAdministrationKey
    name: MedicationAdministrationKey
    type: BIGINT
  - source: maf.EncounterKey
    name: EncounterKey
    type: BIGINT
  - source: maf.PatientDurableKey
    name: PatientDurableKey
    type: BIGINT
  - source: maf.AdministrationInstant
    name: AdministrationInstant
    type: DATETIME2(7)
  - source: maf.AdministrationRoute
    name: AdministrationRoute
    type: NVARCHAR(300)
  - source: maf.AdministrationAction
    name: AdministrationAction
    type: NVARCHAR(300)
  - source: maf.ActionIsMedAdministration
    name: ActionIsMedAdministration
    type: TINYINT
  - source: maf.MedicationKey
    name: MedicationKey
    type: BIGINT
  - source: maf.MedicationOrderKey
    name: MedicationOrderKey
    type: BIGINT
  - source: maf.Dose
    name: Dose
    type: NVARCHAR(200)
  - source: maf.DoseUnit
    name: DoseUnit
    type: NVARCHAR(300)
  - source: maf.Rate
    name: Rate
    type: NVARCHAR(50)
  - source: maf.AdministrationDepartmentKey
    name: AdministrationDepartmentKey
    type: BIGINT
  - source: md.Name
    name: MedicationName
    type: NVARCHAR(300)
  - source: md.GenericName
    name: MedicationGenericName
    type: NVARCHAR(200)
  - source: md.SimpleGenericName
    name: MedicationSimpleGenericName
    type: NVARCHAR(300)
  - source: md.PharmaceuticalClass
    name: MedicationPharmaceuticalClass
    type: NVARCHAR(300)
  - source: md.PharmaceuticalSubclass
    name: MedicationPharmaceuticalSubclass
    type: NVARCHAR(300)
  - source: md.TherapeuticClass
    name: MedicationTherapeuticClass
    type: NVARCHAR(300)
  - source: md.Form
    name: MedicationForm
    type: NVARCHAR(300)
  - source: md.Route
    name: MedicationRoute
    type: NVARCHAR(300)
  filter:
    from:
    - MedicationAdministrationFact AS maf
    join:
    - INNER JOIN {{prefix}}_EDVisits AS pk ON pk.EncounterKey = maf.EncounterKey AND
      pk.PatientDurableKey = maf.PatientDurableKey
    - LEFT JOIN MedicationDim AS md ON md.MedicationKey = maf.MedicationKey
    where:
    - maf._IsDeleted = 0
    - maf.AdministrationDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}
    - maf.AdministrationInstant BETWEEN DATEADD(DAY, -1, pk.ArrivalInstant) AND DATEADD(DAY,
      1, pk.DepartureInstant)
- name: StayDepartments
  dest_table: StayDepartments
  type: fact
  pull_this_cycle: true
  description: Each department a medication was given in during the admission, with
    its specialty and the first time (ICU transfers mid-stay)
  granularity: One row per admission and department
  columns:
  - source: haf.HospitalAdmissionKey
    name: HospitalAdmissionKey
    type: BIGINT
  - source: maf.AdministrationDepartmentKey
    name: AdministrationDepartmentKey
    type: BIGINT
  - source: dept.DepartmentSpecialty
    name: DepartmentSpecialty
    type: NVARCHAR(300)
  - source: maf.AdministrationInstant
    name: AdministrationInstant
    type: DATETIME2(7)
  filter:
    from:
    - MedicationAdministrationFact AS maf
    join:
    - INNER JOIN HospitalAdmissionFact AS haf ON haf.EncounterKey = maf.EncounterKey
    - INNER JOIN {{prefix}}_EDVisits AS pk ON pk.HospitalAdmissionKey = haf.HospitalAdmissionKey
    - INNER JOIN DepartmentDim AS dept ON dept.DepartmentKey = maf.AdministrationDepartmentKey
    where:
