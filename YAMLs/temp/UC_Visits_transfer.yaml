transfer:
  from_template: UC_Visits_intake.yaml
  recipes_sha256: 385ab4edfa4d
  recipes_used:
  - OtherDiagnoses
  - OtherHospitalizations
cosmos_vars:
  project_db: PROJECTD93A5E7
  cosmos_db: Dual
run_vars:
  min_date_key: 19900101
  max_date_key: 20260601
test_options:
  smallset: false
  stop_at_for_pk_table: 10
  random_pk_sample: false
project_vars:
  project_folder: UC Visits
vars: {}
upload_cohorts:
- name: UCPatients
  dest_table: UCPatients
  type: pk
  file_type: parquet
  key_columns:
  - PatientDurableKey
  pending_transfer: true
  push_this_cycle: true
  file_loc: UCPatients.parquet
- name: HospitalICDCodes
  dest_table: HospitalICDCodes
  file_type: csv
  pending_transfer: true
  push_this_cycle: true
  file_loc: data/Codes/ICD-hosp.csv
multipliers: []
batching:
- name: chunk
  kind: row_chunk
  rows_per_batch: 100000
  applies_to: PKTable
cohorts:
- name: OtherDiagnoses
  description: Patient's diagnoses besides the index diagnosis - one per patient per
    diagnosis code, not time-based. For seeing if they have other conditions
  granularity: One diagnoses of a disease by ICD code, for each PatientDurableKey.
  dedup_keys:
  - - PatientDurableKey
    - BillingCodeValue
  dedup_order_by:
  - StartDateKey
  pull_this_cycle: true
  type: fact
  dest_table: OtherDiagnoses
  columns:
  - source: def.DiagnosisEventKey
    name: DiagnosisEventKey
    nullable: false
    type: BIGINT
  - source: tc.StandardName
    name: BillingCodeType
    nullable: true
    description: "ICD code type"
    type: NVARCHAR(900)
  - source: dt.Value
    name: BillingCodeValue
    nullable: true
    type: NVARCHAR(900)
  - source: dt.NameAndCode
    name: NameAndCode
    nullable: true
    type: NVARCHAR(900)
  - source: dur.Years
    name: AgeAtDiagnosis
    nullable: true
    type: INT
  - source: def.IsPrimary
    name: IsPrimary
    nullable: true
    type: BIT
  - source: dt.ReferenceBillingCode
    name: IsReferenceBillingCode
    nullable: true
    description: "0/1 of if this diagnosis was used for Billing submission"
    type: NVARCHAR(900)
  - source: def.Type
    name: TypeOfDx
    nullable: true
    type: NVARCHAR(900)
  - source: tc.Concept
    name: TerminologyConcept
    nullable: true
    type: NVARCHAR(900)
  - source: tc.Name
    name: TerminologyName
    nullable: true
    type: NVARCHAR(900)
  - source: def.Status
    name: Status
    nullable: true
    type: NVARCHAR(900)
  - source: def.StartDateKey
    name: StartDateKey
    nullable: true
    type: INT
  - source: def.EndDateKey
    name: EndDateKey
    nullable: true
    type: INT
  - source: def.PatientDurableKey
    name: PatientDurableKey
    nullable: false
    type: BIGINT
  - source: def.DiagnosisKey
    name: DiagnosisKey
    nullable: false
    type: BIGINT
  - source: def.EncounterKey
    name: EncounterKey
    nullable: false
    type: BIGINT
  filter:
    from:
    - DiagnosisEventFact AS def
    join:
    - "INNER JOIN {{prefix}}_{{PKTable}} AS pk ON pk.PatientDurableKey = def.PatientDurableKey\
      \ AND pk.DiagnosisEventKey <> def.DiagnosisEventKey"
    - "LEFT JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = def.DiagnosisKey"
    - "LEFT JOIN TerminologyConceptDim AS tc ON tc.TerminologyConceptKey = dt.TerminologyConceptKey"
    - "INNER JOIN DurationDim AS dur ON dur.DurationKey = def.AgeKey"
    where:
    - "def._IsDeleted = 0"
    - "dt._IsDeleted = 0"
    - "def.StartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
    - "dt.Type IN ('ICD-10-AM', 'ICD-10-CA', 'ICD-10-CM')"
- name: OtherHospitalizations
  description: Hospitalizations the patient underwent.
  granularity: InpatientEncounterKey is per-hospitalization.
  type: fact
  pull_this_cycle: true
  dest_table: OtherHospitalizations
  dedup_keys:
  - - InpatientEncounterKey
  columns:
  - source: haf.HospitalAdmissionKey
    name: HospitalAdmissionKey
    nullable: false
    type: BIGINT
  - source: haf.EncounterKey
    name: InpatientEncounterKey
    nullable: false
    type: BIGINT
  - source: haf.PatientDurableKey
    name: PatientDurableKey
    nullable: false
    type: BIGINT
  - source: haf.AdmissionDateKey
    name: AdmissionDateKey
    nullable: false
    type: INT
  - source: haf.InpatientAdmissionInstant
    name: InpatientAdmissionInstant
    nullable: false
    type: DATETIME2(7)
  - source: haf.DischargeDateKey
    name: DischargeDateKey
    nullable: true
    type: INT
  - source: haf.DischargeInstant
    name: DischargeInstant
    nullable: true
    type: DATETIME2(7)
  - source: haf.DischargeDisposition
    name: DischargeDisposition
    nullable: true
    type: NVARCHAR(900)
  - source: haf.InpatientLengthOfStayInDays
    name: InpatientLengthOfStayInDays
    nullable: true
    type: INT
  - source: haf.LengthOfStayInDays
    name: LengthOfStayInDays
    nullable: true
    type: INT
  - source: haf.DaysSincePriorAdmission_X
    name: DaysSincePriorAdmission_X
    nullable: true
    type: INT
  - source: haf.ReadmissionCausedByKey_X
    name: ReadmissionCausedByKey_X
    nullable: true
    type: BIGINT
  - source: haf.IsPlannedReadmission_X
    name: IsPlannedReadmission_X
    nullable: true
    type: BIT
  - source: haf.IsUnplannedReadmission_X
    name: IsUnplannedReadmission_X
    nullable: true
    type: BIT
  - source: haf.EncounterType
    name: EncounterType
    nullable: true
    type: NVARCHAR(900)
  - source: haf.FinancialClass
    name: FinancialClass
    nullable: true
    type: NVARCHAR(900)
  - source: dt.Value
    name: ICDCode
    nullable: true
    type: NVARCHAR(900)
  - source: dt.NameAndCode
    name: ICDName
    nullable: true
    type: NVARCHAR(900)
  filter:
    from:
    - HospitalAdmissionFact AS haf
    join:
    - "INNER JOIN {{prefix}}_{{PKTable}} AS pk ON pk.PatientDurableKey = haf.PatientDurableKey"
    - "INNER JOIN DiagnosisEventFact AS dxf ON dxf.EncounterKey = haf.EncounterKey"
    - "INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = dxf.DiagnosisKey"
    - "INNER JOIN {{prefix}}_{{HospitalICDTable}} AS ih ON ih.DiagnosisCode = dt.Value"
    where:
    - "haf._IsDeleted = 0"
    - "haf.AdmissionDateKey IS NOT NULL"
    - "haf.AdmissionDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
    - "dxf._IsDeleted = 0"
    - "dt._IsDeleted = 0"
    - "dt.Type IN ('ICD-10-AM', 'ICD-10-CA', 'ICD-10-CM', 'ICD-9-CM')"
  vars:
    HospitalICDTable: HospitalICDCodes
