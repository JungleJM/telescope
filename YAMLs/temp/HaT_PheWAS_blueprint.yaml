    join:
    - "INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = def.DiagnosisKey"
    - "INNER JOIN PatientDim AS p ON p.DurableKey = def.PatientDurableKey"
    - "LEFT JOIN DurationDim AS dur ON dur.DurationKey = def.AgeKey"
    where:
    - "def._IsDeleted = 0"
    - "def.StartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
    - "dt._IsDeleted = 0"
    - "dt.Type = 'ICD-10-CM'"
    - "dt.Value = 'D89.44'"
    - "p._IsDeleted = 0"
    - "p.IsCurrent = 1"
    - "p.IsValid = 1"
    - "p.UseInCosmosAnalytics_X = 1"
- name: hat_Encounters
  dest_table: hat_Encounters
  type: fact
  pull_this_cycle: true
  description: "Every encounter for hat_Patients in the window, every EncounterFact\
    \ column, and every DepartmentDim column (DepartmentSpecialty) through a LEFT\
    \ JOIN. Python derives first/last encounter (observation start/end) and clinic-visit\
    \ counts from it. A clinic visit is a distinct DateKey with IsOutpatientFaceToFaceVisit\
    \ = 1 and a completed DerivedEncounterStatus.\n"
  granularity: One row per encounter.
  dedup_keys:
  - - EncounterKey
  dedup_order_by:
  - EncounterKey
  columns:
  - source: ef.PatientDurableKey
    name: PatientDurableKey
    nullable: false
    type: BIGINT
