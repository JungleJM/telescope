- name: hat_Labs
  dest_table: hat_Labs
  type: fact
  pull_this_cycle: true
  description: "Every tryptase result for hat_Patients in the window: every LabComponentResultFact\
    \ column and every LabComponentDim column (LEFT JOIN). Filtered to the eight tryptase\
    \ LabComponentKeys found on the VM (2026-10-02, LabComponentDim names, common\
    \ names, base names or LOINC names like '%tryptase%'), all of them kept:\n  2287\
    \  Tryptase SerPl-mCnc (mass/volume, LOINC 21582-2; the usual baseline test)\n\
    \  8166  Tryptase IgE Qn (IgE antibody to tryptase, 7748-7; not a tryptase level)\n\
    \  16740 Tryptase.beta SerPl-mCnc (60539-4)\n  51583 Tryptase Fld-mCnc (body fluid,\
    \ 45334-0)\n  59082 INACTIVE Tryptase (no LOINC; DefaultUnit ng/mL)\n  75051 Tryptase\
    \ SerPl-cCnc (enzymatic activity, 12733-2)\n  86072 Tryptase.mature SerPl-cCnc\
    \ (enzymatic activity, 41870-7)\n  91367 Tryptase SerPl-sCnc (moles/volume, 51834-0)\n\
    Python validates cases (baseline tryptase above about 8 ng/mL) and, later, screens\
    \ controls.\n"
  granularity: One row per lab component result.
  dedup_keys:
  - - LabComponentResultKey
  dedup_order_by:
  - LabComponentResultKey
  columns:
  - source: lcrf.PatientDurableKey
    name: PatientDurableKey
    nullable: false
    type: BIGINT
  - source: lcrf.LabComponentResultKey
    name: LabComponentResultKey
    nullable: false
    type: BIGINT
  - source: lcrf.LabComponentKey
    name: LabComponentKey
    nullable: false
