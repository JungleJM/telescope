upload_cohorts:
- name: CrohnsPatientInfo
  dest_table: CrohnsPatientInfo
  type: pk
  file_type: parquet
  key_columns:
  - PatientDurableKey
  pending_transfer: true
  push_this_cycle: true
  file_loc: CrohnsPatients.parquet
- name: HospitalICDCodes
  dest_table: HospitalICDCodes
  file_type: csv
  pending_transfer: true
