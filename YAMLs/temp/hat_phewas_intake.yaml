# HaT PheWAS, part 1: the HaT patients and what the PheWAS needs about them.
# Controls come later, as ctrl_ tables, with the same columns.
#
# Four tables, each with every column of its Cosmos tables (per the data dictionary),
# so Python can cull later. Only join keys that would repeat another column are left
# out (PatientDim.DurableKey, DiagnosisTerminologyDim.DiagnosisKey, DurationDim.DurationKey,
# DepartmentDim.DepartmentKey, LabComponentDim.LabComponentKey). Columns from a LEFT
# JOIN are nullable whatever the dictionary says: a missing row gives NULLs.
#   hat_Patients     PK. One row per patient with ANY D89.44 (any Type or Status), at
#                    their first D89.44. Also the exclusion list for controls. Python
#                    rebuilds the case set and index date from hat_Diagnoses (Status
#                    filter, 2-distinct-dates rule).
#   hat_Encounters   Every encounter in the window, with its DepartmentDim row (LEFT
#                    JOIN). Observation start/end, clinic-visit counts, specialty.
#   hat_Diagnoses    Every ICD-10-CM diagnosis event in the window, one row per event
#                    and code. The PheWAS events.
#   hat_Labs         Every tryptase result in the window (8 LabComponentKeys), with its
#                    LabComponentDim row (LEFT JOIN). Case validation; later, controls.
#
# Cosmos tables read: PatientDim, DiagnosisEventFact, DiagnosisTerminologyDim,
# DurationDim, EncounterFact, DepartmentDim, LabComponentResultFact, LabComponentDim.
#
# Notes:
# dt.Type = 'ICD-10-CM' is the spelling Cosmos uses (profile query 6, 2026-10-01).
# ICD-9 is left out: everything here postdates the switch to ICD-10.
# Dual on purpose: SneakPeek (a 1% set) checks the pull works on the smaller set first.
# D89.44 entered ICD-10-CM on 2021-10-01: an IndexDate before 20211001 is a diagnosis
# record mapped to D89.44 after the fact. See HaT Considerations.md.
# Open: check project_db is the one to use.

cosmos_vars:
  project_db: PROJECTD93A5E7
  cosmos_db: Dual
run_vars:
  min_date_key: 20150101   # wide on purpose; Python sets the analysis window
  max_date_key: 20260601   # the latest Cosmos has; move it when Cosmos does
test_options:
  smallset: false
  stop_at_for_pk_table: 10
  random_pk_sample: false
project_vars:
  project_folder: HaT PheWAS
vars: {}
upload_cohorts: []
multipliers: []
batching:
  - chunk: 2000
cohorts:
