        name: ComponentSubtype
        nullable: true
      - source: lcd.Type
        name: ComponentType
        nullable: true
    filter:
      from:
        - LabComponentResultFact as lcrf
      join:
        - "INNER JOIN {{prefix}}_hat_Patients AS pk ON pk.PatientDurableKey = lcrf.PatientDurableKey"
        - "LEFT JOIN LabComponentDim AS lcd ON lcd.LabComponentKey = lcrf.LabComponentKey"
      where:
        - "lcrf._IsDeleted = 0"
        - "lcrf.PrioritizedDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
        - "lcrf.LabComponentKey IN (2287, 8166, 16740, 51583, 59082, 75051, 86072, 91367)"
