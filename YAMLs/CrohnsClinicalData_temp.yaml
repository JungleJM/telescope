cosmos_vars:
  project_db: PROJECTD93A5E7
  cosmos_db: Dual
run_vars:
  min_date_key: 19900101
  max_date_key: 20260601
test_options:
  smallset: false
  stop_at_for_pk_table: 10
  random_pk_sample: false
project_vars:
  project_folder: CrohnsClinicalData
vars:

upload_cohorts:
  - name: Crohns_AllCohort
    dest_table: Crohns_AllCohort
    file_type: parquet
    push_this_cycle: true
    type: pk
    key_columns:
      - PatientDurableKey
  - name: HospitalICDTable
    dest_table: HospitalICDTable
    file_type: csv
    push_this_cycle: true
multipliers:

batching:

cohorts:
  - recipe: OtherDiagnoses
    name: OtherDiagnoses
  - recipe: OtherHospitalizations
    name: AllHospitalizations
    vars:
      HospitalICDTable: HospitalICDTable
