# Infant RSV analysis settings.
#
# Every definition the analysis uses is here. Change a value, then run
# `python rsv build` again: the parquets and every page follow it.
#
# `# verified (check N)`: seen in Cosmos by `python rsv verify` (its check N,
# 9 October 2026, 20,000 infant ED visits from December 2024).
# `# unverified`: not yet seen; the named check would show it.
# `# a choice`: a definition picked for the study, from verified values where it
# names any, not a fact about the data.
# Paths are relative to the folder that holds `rsv`.

# Where the pulls are.
pull_folder: runs/Infant_RSV                # the first pull
followup_folder: runs/Infant_RSV_Followup   # the follow-up pull, once it is packaged
analysis_folder: runs/Infant_RSV/analysis   # what `build` writes, and the pages
keys_file: rsv_visit_keys.parquet           # what `keys` writes: the follow-up pull's PK

# Each table, read from the first of its files that exists and has rows.
# `followup:` reads the follow-up pull, `pull:` the Infant_RSV pull: its
# redo's names first, then the first pull's.
sources:
  visits: [pull:EDVisits]
  patients: [followup:Patients, pull:Patients, pull:RSVPatients]
  births: [followup:Births, pull:Births, pull:PatientBirthEvent]
  admissions: [followup:AdmissionDepartments, pull:HospitalAdmissionFact]
  stay_departments: [followup:StayDepartments, pull:StayDepartments]
  ed_vitals: [followup:EDVitals, pull:EDVitals]
  stay_vitals: [pull:InpatientVitals, pull:InpatientVItals]
  ed_labs: [followup:EDLabs, pull:EDLabs, pull:EDLabTestComponents]
  stay_labs: [pull:InpatientLabs, pull:InpatientLabTestComponents]
  ed_meds: [followup:EDMeds, pull:EDMeds]
  diagnoses: [followup:EDDiagnoses, pull:EDDiagnoses, pull:IndexDiagnosis]
  icu_stays: [followup:IcuStays, pull:IcuStays]

# Pages.
page_width: 48        # characters a line may take
min_cell: 11          # counts from 1 to min_cell - 1 print as <11; 0 prints every count

# A visit with no departure time: its ED stay ends this many hours after arrival.
no_departure_hours: 6   # a choice

# Vitals. A reading outside its range is dropped and counted.
temperature_fahrenheit_above: 45   # verified (6): every ED temperature was °F, 32-120; none at or under 45
plausible:              # a choice; units verified (7, 8): SpO2 a percent (0-216 seen), RR per minute (0-182 seen)
  rr: [5, 150]
  spo2: [40, 100]
  temp_c: [30, 43]

# Age at arrival, in days: each band runs from its number up to the next.
age_bands:              # a choice
  0-28d: 0
  1-2m: 29
  3-5m: 91
  6-11m: 183
  12-23m: 365
age_max_days: 731

# Birth dates exact to the day, by PatientDim.BirthDateAccuracy_X. Verified (12):
# Instant 13,980 and Day 2,710 have BirthDate = EarliestPossibleBirthDate_X;
# Month 1,177 and Week 847 never do, so their ages are not exact. A birth row's
# BirthInstant is taken as exact. `age_exact` says which; section `exact_age`.
exact_birth_accuracies: [Instant, Day, birth row]

# Gestational age, in completed weeks.
ga_bands:               # a choice; GA in days verified (23): 22-304 days seen, 98.4% within 22-44 weeks
  <28w: 0
  28-31w: 28
  32-36w: 32
  ">=37w": 37

# RSV seasons run from this month to the month before it, a year later.
season_start_month: 7   # a choice
eras:                   # a choice
  - {name: pre-COVID, from: 2018-19, to: 2019-20}
  - {name: COVID, from: 2020-21, to: 2020-21}
  - {name: post-COVID, from: 2021-22, to: 2022-23}
  - {name: nirsevimab, from: 2023-24, to: 2099-00}

# Diagnoses: a visit's group is the first here whose code it has.
dx_groups:              # verified (25, 27): written with the dot under ICD-10-CM; J21.0 3,152, B97.4 1,215, J12.1 147, J20.5 27 encounters
  - {name: bronchiolitis, codes: [J21.0]}
  - {name: pneumonia, codes: [J12.1]}
  - {name: bronchitis, codes: [J20.5]}
  - {name: RSV other, codes: [B97.4]}

# Groupings. A value not mapped keeps its own name; one in `unknown`, or one
# beginning with `*`, is Unknown. Verified (14, 17, 19, 21, 22): race has a blank
# value (3,449); sex has "Unknown"; ethnicity and financial class have
# *Unspecified and *Not Applicable. None of the other words once listed
# (Patient Declined, Not Reported...) occurred, so they are not listed.
unknown: ["", "unknown"]
race_map: {}
ethnicity_map: {}
financial_class_map: {}
svi_column: SviOverallPctlRankByZip2020_X   # verified (18): a 0-1 rank, 0.0001-1.0000

# VBG: a lab in the ED stay whose LOINC code is listed. Verified (28): venous pH is
# 2746-6 (1,611 results; 2746-4, once listed here, never occurred) and venous pCO2
# 2021-4 (1,418). Also seen: 2705-2 pO2, 14627-4 HCO3, 1927-3 base excess, 2711-0
# O2 saturation, all venous. Which of them make "a VBG" is a choice.
vbg_loinc: [2746-6, 2021-4]
vbg_name_patterns: []   # none: what the component Name holds for each code is listed (28) but not relied on

# IV fluids: an ED administration by one of these routes, of a medication whose
# name begins with one of these. Verified (30, 32): the IV routes are
# "intravenous", "Intravenous Drip" and "Intravenous bolus"; the names are
# MedicationDim's, as seen. Which names count as IV fluids is a choice: here the
# crystalloids given to hydrate, not flushes, nor drugs carried in saline, nor
# dextrose in water. 86,215 IV doses (of the sample's) have the name *Unspecified,
# so IV fluids are undercounted; the build page says how many in the ED.
iv_routes: ["^intravenous$", "^intravenous drip$", "^intravenous bolus$"]
iv_fluid_patterns:
  - '^DEXTROSE\ 5\ %\ AND\ 0\.9\ %\ SODIUM\ CHLORIDE\ INTRAVENOUS\ SOLUTION'
  - '^SODIUM\ CHLORIDE\ 0\.9\ %\ INTRAVENOUS\ SOLUTION'
  - '^POTASSIUM\ CHLORIDE\ 20\ MEQ/L\ IN\ D5\-0\.9\ %\ SODIUM\ CHLORIDE\ INTRAVENOUS'
  - '^DEXTROSE\ 5\ %\ AND\ 0\.45\ %\ SODIUM\ CHLORIDE\ INTRAVENOUS\ SOLUTION'
  - '^POTASSIUM\ CHLORIDE\ 20\ MEQ/L\ IN\ DEXTROSE\ 5\ %\-0\.45\ %\ SODIUM\ CHLORIDE\ IV'
  - '^DEXTROSE\ 5\ %\ AND\ LACTATED\ RINGERS\ INTRAVENOUS\ SOLUTION'
  - '^LACTATED\ RINGERS\ INTRAVENOUS\ SOLUTION'
  - '^DEXTROSE\ 5\ %\ AND\ 0\.2\ %\ SODIUM\ CHLORIDE\ INTRAVENOUS\ SOLUTION'
  - '^SODIUM\ CHLORIDE\ 0\.45\ %\ INTRAVENOUS\ SOLUTION'
iv_given_actions: []   # empty: ActionIsMedAdministration decides. Verified (31): 1 for Given and New Bag, 0 for Rate Verify, Stopped and the rest; Given also has it empty (23,848), and empty counts as given

# ICU: an admission with any of these department specialties (case ignored).
# The build page lists the specialties seen, and where admissions were admitted to.
# Both are DepartmentSpecialty values Cosmos has (`rsv icu`, 9 October 2026:
# Pediatric Intensive Care 1,797 and Critical Care Medicine 1,675 infant
# admissions in December 2024). Which count as ICU is a choice; also seen there:
# Cardiac Intensive Care, Medical Critical Care, Surgical Cardiothoracic
# Critical Care, Neonatology (which also holds newborn nurseries).
icu_specialties: [Pediatric Intensive Care, Critical Care Medicine]

# The registry's stays are on their admission's EncounterKey 97.8% of the time
# (`rsv icu` result 11, 9 October 2026), and it counts the NICU (Neonatology) as
# ICU; `icu_unit` says where each stay began.
# Where `icu` comes from (a choice): `registry`, Cosmos's ICU Stay Registry, when
# its pull is there, else the specialties above; or `specialty`, always them.
# Either way the build keeps both: icu_registry and icu_by_specialty.
icu_source: registry

# Named sections: a filter on visits.parquet, written as pandas' DataFrame.query.
sections:
  first_visits: first_visit
  exact_age: age_exact
  under_3_months: age_days < 91
  preterm: ga_weeks < 37
  admitted: admitted
  picu_admissions: admit_specialty == 'Pediatric Intensive Care'
  nirsevimab_era: era == 'nirsevimab'
  pre_nirsevimab: era != 'nirsevimab'

# `python rsv compare <grouping>` takes any of these.
groupings: [age_band, ga_band, season, era, sex, race, ethnicity, svi_quartile, financial_class, admitted, icu, icu_unit, admit_specialty, dx_group, first_visit]

# `python rsv admission`: the factors, the outcomes, and what the models adjust for.
admission_factors: [race, ethnicity, svi_quartile, financial_class]
adjust_for: [age_band, season]
model_min_level: 50    # levels with fewer visits are pooled as Other in the models

# `python rsv verify`: the sample its checks run on, against Cosmos.
verify:
  from: 20241201      # infants' ED arrivals from this day
  to: 20241231        # to this day
  visits: 20000       # at most this many of them

# `python rsv all`: the pages of a first run.
first_run_compare: [age_band, ga_band, era, admitted]
