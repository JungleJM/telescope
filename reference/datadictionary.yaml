          On the dictionary page; description cut off in the screenshot.
      ScheduledAdministrationInstant:
        type: datetime
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      SourceComboKey_X:
        type: bigint (foreign key to MedicationEventSourceBridge)
        nullable: true
        description: >
          Composite source key for the administration action, referencing origin system.
    standard_where:
      - "_IsDeleted = 0"
      - "AdministrationDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"  # the partition key

  # Checked against its Cosmos dictionary page (2026-09-29; screenshots in
  # reference/DDict image refs/PregnancyFact/): columns, types, and
  # keys from its ER diagram.
  # Nullability not checked: no row is expanded in the screenshots.
  # Only columns with the database icon; SD-only columns left out (D116).
  PregnancyFact:
    description: >
      Pregnancy episode fact table. One row per pregnancy episode, with
      episode-level dates, parity/gravida counts, delivery outcomes, and
      pre-/post-delivery anthropometrics. Linked to patients via PatientDurableKey
      and to births via BirthFact.PregnancyKey.
    granularity: >
      One row per pregnancy episode per patient (pregnancy-episode-level fact).
    columns:
      _IsDeleted:
        type: tinyint (flag)
        nullable: false
        description: >
          Logical deletion flag for the pregnancy episode record.
      _IsInferred:
        type: tinyint (flag)
        nullable: false
        description: >
          Indicates the pregnancy record has been inferred rather than directly sourced.
      Count:
        type: tinyint
        nullable: false
        description: >
          Cosmos row count indicator; typically 1 for real pregnancy episode rows.
      EpisodeEndDateKey:
        type: bigint (DateKey; foreign key to DateDim)
        nullable: true
        description: >
          DateKey representing end of the pregnancy episode (e.g., delivery, loss).
      EpisodeStartDateKey:
        type: bigint (DateKey; foreign key to DateDim; partition key)
        nullable: true
        description: >
          DateKey representing start of the pregnancy episode, often based on
          estimated conception or first documentation.
      HadCesarean:
        type: tinyint (flag)
        nullable: true
        description: >
          Indicates that at least one delivery in the pregnancy was cesarean.
      HadFetalDemise:
        type: tinyint (flag)
        nullable: true
        description: >
          Indicates that fetal demise occurred during this pregnancy.
      HadNeonatalDemise:
        type: tinyint (flag)
        nullable: true
        description: >
          Indicates that neonatal demise occurred for at least one infant in this
          pregnancy.
      HasDelivery:
        type: tinyint (flag)
        nullable: true
        description: >
          Indicates that the pregnancy episode includes at least one delivery event.
      HasDeliverySummary:
        type: tinyint (flag)
        nullable: true
        description: >
          Indicates a delivery summary record exists for this pregnancy.
      IsHistorical:
        type: tinyint (flag)
        nullable: true
        description: >
          Indicates pregnancy is historical (documented retrospectively rather than
          managed in real time).
      LastDeliveryDateKey:
        type: bigint (DateKey; foreign key to DateDim)
        nullable: true
        description: >
          DateKey for the most recent delivery associated with this pregnancy.
      LastDeliveryGestationalAge:
        type: int
        nullable: true
        description: >
          Gestational age (e.g., in weeks or days) at the most recent delivery.
      NumberOfFetuses:
        type: tinyint
        nullable: true
        description: >
          Number of fetuses associated with this pregnancy (e.g., singleton, twins).
      PatientDurableKey:
        type: bigint (foreign key to PatientDim.DurableKey)
        nullable: false
        description: >
          Patient associated with this pregnancy episode.
      PostDeliveryBmi_X:
        type: numeric(18,4)
        nullable: true
        description: >
          BMI measured post-delivery, derived by source logic and de-identified.
      PreDeliveryBmi_X:
        type: numeric(18,4)
        nullable: true
        description: >
          BMI measured pre-delivery, derived by source logic. Use carefully as
          measurement timing may vary.
      PregnancyAbortionCount:
        type: tinyint
        nullable: true
        description: >
          Count of abortions (therapeutic or spontaneous) documented for this pregnancy
          episode if tracked at episode level.
      PregnancyEctopicCount:
        type: tinyint
        nullable: true
        description: >
          Count of ectopic pregnancies associated with this episode context.
      PregnancyEstimatedEndDate:
        type: date
        nullable: true
        description: >
          Estimated pregnancy end date (e.g., EDD); use PregnancyEstimatedEndDateKey
          for filtering and reporting.
      PregnancyEstimatedEndDateKey:
        type: bigint (DateKey; foreign key to DateDim)
        nullable: true
        description: >
          DateKey for estimated pregnancy end date.
      PregnancyEstimatedStartDate:
        type: date
        nullable: true
        description: >
          Estimated pregnancy start date (e.g., based on LMP or ultrasound).
      PregnancyEstimatedStartDateKey:
        type: bigint (DateKey; foreign key to DateDim)
        nullable: true
        description: >
          DateKey for estimated pregnancy start date.
      PregnancyGravidaCount:
        type: tinyint
        nullable: true
        description: >
          Gravida count (number of prior pregnancies including current) at the time
          of this pregnancy.
      PregnancyOutcomeComboKey:
        type: bigint (foreign key to PregnancyOutcomeBridge)
        nullable: true
        description: >
          On the dictionary page; description not yet transcribed.
      PregnancyKey:
        type: bigint (primary key)
        nullable: false
        description: >
          Primary key for the pregnancy episode fact record. Links to
          BirthFact.PregnancyKey.
      PregnancyParaCount:
        type: tinyint
        nullable: true
        description: >
          Para count (number of prior pregnancies resulting in viable births).
      PregnancyPretermCount:
        type: tinyint
        nullable: true
        description: >
          Count of prior preterm births associated with this pregnancy context.
      PregnancyPriorFetalDemiseCount:
        type: tinyint
        nullable: true
        description: >
          Count of prior fetal demises documented for the patient at the time of this
          pregnancy.
      PregnancyPriorLiveBirthCount:
        type: tinyint
        nullable: true
        description: >
          Number of prior live births documented at the time of this pregnancy.
      PregnancySpontaneousAbortionCount:
        type: tinyint
        nullable: true
        description: >
          Count of spontaneous abortions associated with this pregnancy context.
      PregnancyStartAgeKey:
        type: bigint (foreign key to DurationDim)
        nullable: true
        description: >
          Age key representing the patient's age at pregnancy start.
      PregnancyTermCount:
        type: tinyint
        nullable: true
        description: >
          Number of term births associated with this pregnancy episode.
      PregnancyTherapeuticAbortionCount:
        type: tinyint
        nullable: true
        description: >
          Count of therapeutic abortions associated with this pregnancy context.
      PregravidBmi:
        type: numeric(18,1)
        nullable: true
        description: >
          BMI measured prior to pregnancy (pregravid), when documented.
      PregravidWeight:
        type: numeric(18,1)
        nullable: true
        description: >
          Weight prior to pregnancy (pregravid), de-identified and possibly unit
          normalized.
      PriorCesarean:
        type: tinyint (flag)
        nullable: true
        description: >
          Indicates the patient has a history of prior cesarean delivery before this
          pregnancy.
      SourceComboKey_X:
        type: bigint (foreign key to BirthSourceBridgeX)
        nullable: true
        description: >
          Composite source key representing origin metadata for the pregnancy record.
      WorkingEstimatedDateOfDeliveryKey:
        type: bigint (DateKey; foreign key to DateDim)
        nullable: true
        description: >
          DateKey for working estimated date of delivery (EDD) used during pregnancy
          care.
    standard_where:
      - "_IsDeleted = 0"
      - "EpisodeStartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"  # the partition key

  # Checked against its Cosmos dictionary page (2026-09-29; screenshots in
  # reference/DDict image refs/DiagnosisTerminologyDim/): columns, types, and
  # keys from the Columns tab's links (the page has no ER diagram).
  # Nullability not checked: no row is expanded in the screenshots.
  # Only columns with the database icon; SD-only columns left out (D116).
  DiagnosisTerminologyDim:
    description: >
      Diagnosis terminology dimension table. One row per diagnosis code representation
      in a particular terminology (e.g., ICD-10-CM, SNOMED). Preferred source for
      code-level details for diagnoses used in DiagnosisEventFact and other tables.
    granularity: >
      One row per diagnosis code representation in a terminology (diagnosis-code-level
      dimension).
    columns:
      _IsDeleted:
        type: tinyint (flag)
        nullable: false
        description: >
          Logical deletion flag for the diagnosis terminology record.
      _IsInferred:
        type: tinyint (flag)
        nullable: false
        description: >
          Indicates the terminology record has been inferred.
      DiagnosisKey:
        type: bigint (foreign key to DiagnosisDim)
        nullable: false
        description: >
          Key linking this terminology record to the core diagnosis concept in
          DiagnosisDim.
      DiagnosisTerminologyKey:
        type: bigint (primary key)
        nullable: false
        description: >
          Primary key for the diagnosis terminology dimension row.
      DisplayString:
        type: nvarchar(300)
        nullable: true
        description: >
          Human-readable display string for the diagnosis concept, often combining
          name and code in a user-friendly format.
      GroupedNameAndCode:
        type: nvarchar(850)
        nullable: true
        description: >
          Grouped representation combining name and code for analytic grouping and
          reporting.
      NameAndCode:
        type: nvarchar(850)
        nullable: true
        description: >
          Concatenation of diagnosis name and code, often used as a canonical label.
      ReferenceBillingCode:
        type: tinyint (flag)
        nullable: true
        description: >
          1/0 flag (tinyint) on its dictionary page: whether this row's code is the
          reference billing code. Not the code itself; that is in Value.
      Parent:
        type: tinyint (flag)
        nullable: true
        description: >
          A 1/0 flag (tinyint) on its dictionary page; description not yet transcribed.
      TerminologyConceptKey:
        type: bigint (foreign key to TerminologyConceptDim)
        nullable: true
        description: >
          Key to the underlying terminology concept record.
      Type:
        type: nvarchar(300)
        nullable: true
        description: >
          Terminology type (e.g., ICD-10-CM, SNOMED CT, internal code set).
      Value:
        type: nvarchar(300)
        nullable: true
        description: >
          Raw value for the terminology representation; often the code or canonical
          identifier.
    standard_where:
      - "_IsDeleted = 0"

  # Checked against its Cosmos dictionary page (2026-09-29; screenshots in
  # reference/DDict image refs/DurationDim/): columns, types, and
  # keys from the Columns tab's links (the page has no ER diagram).
  # Descriptions cut off at the right; the old ones kept.
  # The page has no _IsDeleted, so no standard_where.
  # Nullability not checked: no row is expanded in the screenshots.
  # Only columns with the database icon; SD-only columns left out (D116).
  DurationDim:
    description: >
      Duration dimension table. Encodes durations in days, weeks, months, years and
      display strings. Used to represent duration fields as dimensional keys (e.g.,
      MedicationOrderFact.DurationKey).
    granularity: >
      One row per duration between two dates.
    columns:
      Days:
        type: int
        nullable: true
        description: >
          Duration expressed in days.
      DaysDisplayString:
        type: nvarchar(50)
        nullable: true
        description: >
          Human-readable display string for duration in days (e.g., "7 days").
      DisplayString:
        type: nvarchar(50)
        nullable: true
        description: >
          General display string representation for the duration, potentially combining
          multiple units.
      DurationKey:
        type: bigint (primary key)
        nullable: false
        description: >
          Primary key for the duration dimension row.
      Months:
        type: int
        nullable: true
        description: >
          Duration expressed in months.
      MonthsDisplayString:
        type: nvarchar(50)
        nullable: true
        description: >
          Human-readable display string for duration in months (e.g., "3 months").
      Weeks:
        type: int
        nullable: true
        description: >
          Duration expressed in weeks.
      WeeksDisplayString:
        type: nvarchar(50)
        nullable: true
        description: >
          Human-readable display string for duration in weeks (e.g., "2 weeks").
      Years:
        type: int
        nullable: true
        description: >
          Duration expressed in years.
      YearsDisplayString:
        type: nvarchar(50)
        nullable: true
        description: >
          Human-readable display string for duration in years (e.g., "1 year").

  # Checked against its Cosmos dictionary page (2026-09-29, and whole on
  # 2026-09-30; screenshots in reference/DDict image refs/ProblemListFact/):
  # columns, types, descriptions, and keys from its ER diagram.
  # Type, which the page lacks, removed.
  # Nullability not checked: no row is expanded in the screenshots.
  # Only columns with the database icon; SD-only columns left out (D116).
  ProblemListFact:
    description: >
      Problem list fact table. One row per problem list entry for a patient, containing
      diagnosis keys, dates, chronic flags, and status. Used for longitudinal conditions
      separate from billing diagnoses.
    granularity: >
      One row per problem list diagnosis for a patient.
    columns:
      _IsDeleted:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is deleted
      _IsInferred:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is inferred
      AgeKey:
        type: bigint (foreign key to DurationDim)
        nullable: true
        description: >
          Patient age as of the start date of the problem list diagnosis. This value is
          calculated based on StartDateKey and the BirthDate column in PatientDim. This
          key is calculated in the de-identification process.
      Chronic:
        type: tinyint (flag)
        nullable: true
        description: >
          1/0 column that indicates whether the diagnosis is chronic. This column
          returns 1 if the diagnosis is chronic and 0 if the diagnosis isn't chronic.
      Count:
        type: tinyint
        nullable: false
        description: >
          Artificial measure on which calculations can be done. The value is 0 for rows
          marked as deleted or masked. Masked rows are rows that contain data from
          exclusively non-greenlit sources or rows that contai... (the rest is cut
          off in the screenshot).
      DiagnosisKey:
        type: bigint (foreign key to DiagnosisDim)
        nullable: false
        description: >
          Diagnosis associated with the problem list entry
      EncounterKey:
        type: bigint (foreign key to EncounterFact)
        nullable: true
        description: >
          Encounter on which the problem list diagnosis was added to the patient.
      EndDateKey:
        type: bigint (DateKey; foreign key to DateDim)
        nullable: true
        description: >
          Problem list resolved date
      IsCancerProblem:
        type: tinyint (flag)
        nullable: true
        description: >
          1/0 column that indicates whether the problem list diagnosis is a cancer
          diagnosis. This column returns 1 if the diagnosis is a cancer diagnosis and 0
          if the diagnosis is not a cancer diagnosis.
      PatientDurableKey:
        type: bigint (foreign key to PatientDim.DurableKey)
        nullable: false
        description: >
          Patient associated with the problem list entry
      ProblemListKey:
        type: bigint (primary key)
        nullable: false
        description: >
          Surrogate key used to uniquely identify the record
      SourceComboKey_X:
        type: bigint (foreign key to DiagnosisEventSourceBridge)
        nullable: true
        description: >
          Source of the problem list data
      StartDateKey:
        type: bigint (DateKey; foreign key to DateDim; partition key)
        nullable: true
        description: >
          Problem list diagnosis noted date. For Epic data, the value is the noted date
          when available, otherwise the date of entry.
      Status:
        type: nvarchar(300)
        nullable: true
        description: >
          Status of the problem list diagnosis. For Epic data, this column can contain
          Active or Resolved statuses.
    standard_where:
      - "_IsDeleted = 0"
      - "StartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"  # the partition key

  # Checked against its Cosmos dictionary page (2026-09-29; screenshots in
  # reference/DDict image refs/TerminologyConceptDim/): columns, types, and
  # keys from the Columns tab's links (the page has no ER diagram).
  # Descriptions cut off at the right; the old ones kept.
  # Nullability not checked: no row is expanded in the screenshots.
  # Only columns with the database icon; SD-only columns left out (D116).
  TerminologyConceptDim:
    description: >
      Terminology concept dimension table. One row per concept in a terminology (e.g., a
      code or concept in ICD-10-CM, SNOMED CT, RxNorm, ATC, internal value set). Serves
      as a generic concept backbone that other terminology- specific dimensions (such as
      DiagnosisTerminologyDim or MedicationCodeDim) reference via TerminologyConceptKey.
    granularity: >
      One row per concept.
    columns:
      _IsDeleted:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is deleted
      _IsInferred:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is inferred
      Concept:
        type: nvarchar(300)
        nullable: true
        description: >
          Concept identifier string as used within the terminology or value set (for
          example, a code or concept ID).
      Name:
        type: nvarchar(550)
        nullable: true
        description: >
          Human-readable name or label for the terminology concept.
      StandardName:
        type: nvarchar(50)
        nullable: true
        description: >
          Standardized or normalized name for the concept, used to harmonize naming
          across contributors and terminologies.
      TerminologyConceptKey:
        type: bigint (primary key)
        nullable: false
        description: >
          Primary key for the terminology concept dimension row. Referenced by other
          terminology tables such as DiagnosisTerminologyDim and
          TerminologyConceptSetDim.
    standard_where:
      - "_IsDeleted = 0"

  # Checked against its Cosmos dictionary page (2026-09-29; screenshots in
  # reference/DDict image refs/ProcedureEventFact/): columns, types, and
  # keys from its ER diagram.
  # Nullability not checked: no row is expanded in the screenshots.
  # Only columns with the database icon; SD-only columns left out (D116).
  ProcedureEventFact:
    description: >
      Procedure event fact table. Rows represent documented procedures
      associated with encounters, with code, modifiers, quantity, and
      timing fields. Use ProcedureDurableKey to link to ProcedureDim
      when needed for code-level detail.
    granularity: >
      One row per documented procedure event per encounter
      (procedure-event-level fact).
    columns:
      _IsDeleted:
        type: tinyint (flag)
        nullable: false
        description: >
          Logical deletion flag for the procedure event record.
      _IsInferred:
        type: tinyint (flag)
        nullable: false
        description: >
          Indicates the procedure event record has been inferred rather than
          directly sourced; useful for lineage and data quality checks.
      AgeAtProcedureDateKey:
        type: bigint (foreign key to DurationDim)
        nullable: true
        description: >
          Age key representing patient age at the time of the procedure.
      Count:
        type: tinyint
        nullable: false
        description: >
          Cosmos row count indicator; typically 1 for real procedure event rows.
      EncounterKey:
        type: bigint (foreign key to EncounterFact)
        nullable: true
        description: >
          Encounter associated with the procedure event. Many analyses use
          DISTINCT EncounterKey when counting procedures per encounter.
      FirstModifier:
        type: nvarchar(50)
        nullable: true
        description: >
          First procedure modifier code, when present (e.g., -26, -TC).
      FourthModifier:
        type: nvarchar(50)
        nullable: true
        description: >
          Fourth procedure modifier code, when present.
      IsUnsuccessfulAttempt:
        type: tinyint (flag)
        nullable: true
        description: >
          Indicates the procedure was attempted but not successfully completed.
          Use this flag when distinguishing completed procedures from attempts.
      PatientDurableKey:
        type: bigint (foreign key to PatientDim.DurableKey)
        nullable: false
        description: >
          Patient durable key associated with the procedure event.
      PerformingProviderDurableKey:
        type: bigint (foreign key to ProviderDim.DurableKey)
        nullable: true
        description: >
          On the dictionary page; description not yet transcribed.
      ProcedureCode:
        type: nvarchar(50)
        nullable: true
        description: >
          Procedure code value as captured for the event (e.g., CPT, HCPCS,
          internal code), interpreted together with ProcedureCodeSet.
      ProcedureCodeSet:
        type: nvarchar(300)
        nullable: true
        description: >
          Code set for ProcedureCode (e.g., CPT, HCPCS, internal). Use this
          when grouping procedures by coding system.
      ProcedureDurableKey:
        type: bigint (foreign key to ProcedureDim.DurableKey)
        nullable: true
        description: >
          Durable key linking the event to the procedure dimension record
          for additional code-level attributes.
      ProcedureEndDateKey:
        type: bigint (DateKey; foreign key to DateDim)
        nullable: true
        description: >
          DateKey representing procedure end date when documented. Join to
          DateDim for calendar attributes if needed for presentation.
      ProcedureEndInstant:
        type: datetime
        nullable: true
        description: >
          Timestamp when the procedure ended, de-identified and time-shifted.
      ProcedureEventKey:
        type: bigint (primary key)
        nullable: false
        description: >
          Primary key for the procedure event fact record.
      ProcedureStartDateKey:
        type: bigint (DateKey; foreign key to DateDim; partition key)
        nullable: true
        description: >
          DateKey representing procedure start date. Prefer DateKey filtering
          rather than joining to DateDim for performance.
      ProcedureStartInstant:
        type: datetime
        nullable: true
        description: >
          Timestamp when the procedure started, de-identified and time-shifted.
      Quantity:
        type: numeric(18,5)
        nullable: true
        description: >
          Quantity associated with the procedure event (for example, number of
          units or repeats). Interpret in context of the specific procedure.
      SecondModifier:
        type: nvarchar(50)
        nullable: true
        description: >
          Second procedure modifier code, when present.
      SourceComboKey:
        type: bigint (foreign key to ProcedureEventSourceBridge)
        nullable: true
        description: >
          Composite source key for the procedure event, used to identify
          origin system and mapping lineage.
      ThirdModifier:
        type: nvarchar(50)
        nullable: true
        description: >
          Third procedure modifier code, when present.
      Type:
        type: nvarchar(300)
        nullable: true
        description: >
          Procedure event type category (e.g., professional, facility,
          surgical), depending on local configuration.
    standard_where:
      - "_IsDeleted = 0"
      - "ProcedureStartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"  # the partition key

  # Checked against its Cosmos dictionary page (2026-09-29; screenshots in
  # reference/DDict image refs/VitalsFact/): columns, types, and
  # keys from its ER diagram.
  # Descriptions seen from DiastolicBloodPressure down; above it, cut off
  # at the right, the old ones kept.
  # Nullability not checked: no row is expanded in the screenshots.
  # Only columns with the database icon; SD-only columns left out (D116).
  VitalsFact:
    description: >
      Vitals fact table. Each row is a set of vitals measured at the same date and time
      (blood pressure, pulse, height, weight and so on), for a patient and usually an
      encounter.
    granularity: >
      One row per set of vitals measured at the same time.
    columns:
      _IsDeleted:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is deleted
      _IsInferred:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is inferred
      BodyMassIndex:
        type: numeric(18,4)
        nullable: true
        description: >
          BMI value associated with the measurement. May be source-calculated or derived
          using height and weight; use CalculatedBodyMassIndex_X to distinguish source
          vs derived in some implementations.
      CalculatedBodyMassIndex_X:
        type: numeric(18,4)
        nullable: true
        description: >
          BMI calculated by source logic or derived mapping, separate from raw
          BodyMassIndex when both are present.
      Count:
        type: tinyint
        nullable: false
        description: >
          Cosmos row count indicator; typically 1 for real vitals rows.
      DateKey:
        type: bigint (DateKey; foreign key to DateDim; partition key)
        nullable: false
        description: >
          DateKey representing when the vital sign was taken. Use this for filtering by
          date without joining to DateDim.
      DiastolicBloodPressure:
        type: int
        nullable: true
        description: >
          Diastolic blood pressure in millimeters of mercury
      EncounterKey:
        type: bigint (foreign key to EncounterFact)
        nullable: true
        description: >
          Encounter associated with the vitals measurements
      HeadCircumference:
        type: numeric(18,2)
        nullable: true
        description: >
          Head circumference in inches
      Height:
        type: numeric(18,2)
        nullable: true
        description: >
          Height in inches
      LastKnownHeight_X:
        type: numeric(18,2)
        nullable: true
        description: >
          This column stores the patient's height in inches. For patients age 18 and
          older, it performs a lookback to determine the most recent height measurement
          for the patient. For patients whose age is under 18, ... (the rest is cut off
          in the screenshot).
      PatientDurableKey:
        type: bigint (foreign key to PatientDim.DurableKey)
        nullable: false
        description: >
          Link to PatientDim's durable key
      PulseRate:
        type: int
        nullable: true
        description: >
          Pulse in heart beats per minute
      RespirationRate:
        type: int
        nullable: true
        description: >
          Respirations per minute
      SourceComboKey:
        type: bigint (foreign key to VitalsSourceBridge)
        nullable: true
        description: >
          Sources of the vitals measurement. Use this instead of SourceKey if there are
          multiple sources.
      SpO2:
        type: int
        nullable: true
        description: >
          Peripheral oxygen saturation as a percentage
      SystolicBloodPressure:
        type: int
        nullable: true
        description: >
          Systolic blood pressure in millimeters of mercury
      TakenInstant:
        type: datetime
        nullable: true
        description: >
          Date and time the vitals were measured
      Temperature:
        type: numeric(18,2)
        nullable: true
        description: >
          Temperature in Fahrenheit
      VitalsKey:
        type: bigint (primary key)
        nullable: false
        description: >
          Primary key for the vitals fact record. Guard on VitalsKey > 0 when excluding
          placeholder rows.
      Weight:
        type: numeric(18,2)
        nullable: true
        description: >
          Weight in pounds
    standard_where:
      - "_IsDeleted = 0"
      - "DateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"  # the partition key

  # Checked against its Cosmos dictionary page (2026-09-29; screenshots in
  # reference/DDict image refs/CoverageDim/): columns, types, and
  # keys from the Columns tab's links (the page has no ER diagram).
  # Descriptions cut off at the right; the old ones kept.
  # Nullability not checked: no row is expanded in the screenshots.
  # Only columns with the database icon; SD-only columns left out (D116).
  CoverageDim:
    description: >
      Coverage dimension table. Represents coverage and payor concepts such as financial
      class, payor vs coverage flags, and self-pay. Referenced from encounter- and
      admission-level facts via CoverageComboKey_X through CoverageBridgeX.
    granularity: >
      One row per coverage, benefit plan, or payer.
    columns:
      _IsDeleted:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is deleted
      _IsInferred:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is inferred
      CoverageFinancialClass:
        type: nvarchar(300)
        nullable: true
        description: >
          Financial class category associated with this coverage (e.g., commercial,
          Medicare, Medicaid, self-pay surrogate).
      CoverageKey:
        type: bigint (primary key)
        nullable: false
        description: >
          Primary key for the coverage dimension row. Used in CoverageBridgeX to form
          composite keys referenced by encounter and admission facts.
      IsCoverage:
        type: tinyint (flag)
        nullable: true
        description: >
          Indicates the record represents a coverage concept rather than a pure
          payor-only concept in mixed configurations.
      IsPayor:
        type: tinyint (flag)
        nullable: true
        description: >
          Indicates the record represents a payor concept. Some records may serve as
          both payor and coverage depending on local mapping.
      IsSelfPay:
        type: tinyint (flag)
        nullable: true
        description: >
          Flag indicating self-pay. When true, this coverage concept represents a
          self-pay situation for encounters/admissions linked via CoverageComboKey_X.
      ReferenceFinancialClass:
        type: nvarchar(300)
        nullable: true
        description: >
          Reference or normalized financial class value for this coverage concept, used
          to harmonize financial classes across organizations.
      ReferencePayer:
        type: nvarchar(300)
        nullable: true
        description: >
          Reference or normalized payer name associated with this coverage concept, used
          for cross-organization payer grouping.
    standard_where:
      - "_IsDeleted = 0"

  # Checked against its Cosmos dictionary page (2026-09-29; screenshots in
  # reference/DDict image refs/DiagnosisDim/): columns, types, and
  # keys from the Columns tab's links (the page has no ER diagram).
  # Nullability not checked: no row is expanded in the screenshots.
  # Only columns with the database icon; SD-only columns left out (D116).
  DiagnosisDim:
    description: >
      Diagnosis dimension. Each row is a diagnosis, from the ICD-9, ICD-10 and SNOMED
      loads. DiagnosisEventFact, ProblemListFact and EncounterFact point at it by
      DiagnosisKey; the codes are in DiagnosisTerminologyDim.
    granularity: >
      One row per diagnosis.
    columns:
      _IsDeleted:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is deleted
      _IsInferred:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is inferred
      DiagnosisKey:
        type: bigint (primary key)
        nullable: false
        description: >
          Surrogate key used to uniquely identify the record
      Name:
        type: nvarchar(200)
        nullable: true
        description: >
          Diagnosis name
    standard_where:
      - "_IsDeleted = 0"

  # Checked against its Cosmos dictionary page (2026-09-29; screenshots in
  # reference/DDict image refs/ProcedureDim/): columns, types, and
  # keys from the Columns tab's links (the page has no ER diagram).
  # Snapshot (Type 2): a row per procedure per date range, IsCurrent = 1
  # the current one. ProcedureKey, the table's own key, is SD only;
  # ProcedureEventFact points at DurableKey.
  # Nullability not checked: no row is expanded in the screenshots.
  # Only columns with the database icon; SD-only columns left out (D116).
  ProcedureDim:
    description: >
      Procedure dimension. Each row is a procedure for a date range: it keeps history,
      and IsCurrent = 1 marks the current row. For Epic data, only charge procedures.
    granularity: >
      One row per procedure for a date range.
    columns:
      _IsDeleted:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is deleted
      _IsInferred:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is inferred
      Category:
        type: nvarchar(200)
        nullable: true
        description: >
          Category associated with the procedure
      Code:
        type: nvarchar(50)
        nullable: true
        description: >
          Code associated with the procedure
      CodeSet:
        type: nvarchar(300)
        nullable: true
        description: >
          Code set associated with the procedure
      CptCode:
        type: nvarchar(50)
        nullable: true
        description: >
          Current Procedural Terminology (CPT) code associated with the procedure. This
          column will be changed in the future to have no change tracking (Type 1).
      DurableKey:
        type: bigint (durable key, one per procedure; ProcedureKey, the table's own key, is SD only)
        nullable: true
        description: >
          Durable key used to identify the record
      HcpcsCode:
        type: nvarchar(50)
        nullable: true
        description: >
          Healthcare Common Procedure Coding System (HCPCS) code associated with the
          procedure. This column will be changed in the future to have no change
          tracking (Type 1).
      IsCurrent:
        type: bit (flag)
        nullable: true
        description: >
          1 indicates this is the most recent information, otherwise 0
      Name:
        type: nvarchar(300)
        nullable: true
        description: >
          Name of the procedure
      OtherCode:
        type: nvarchar(50)
        nullable: true
        description: >
          Code associated with the procedure for code types other than CPT, HCPCS, ADA,
          or ASA codes. This column will be changed in the future to have no change
          tracking (Type 1).
      OtherCodeType:
        type: nvarchar(300)
        nullable: true
        description: >
          Code type associated with the procedure for code types other than CPT, HCPCS,
          ADA, or ASA codes. This column will be changed in the future to have no change
          tracking (Type 1).
      ShortName:
        type: nvarchar(300)
        nullable: true
        description: >
          Shortened name of the procedure
    standard_where:
      - "_IsDeleted = 0"
      - "IsCurrent = 1"

  # Checked against its Cosmos dictionary page (2026-09-29; screenshots in
  # reference/DDict image refs/LabTestFact/): columns, types, and
  # keys from its ER diagram.
  # The screenshot's page heading is cut off; its ER diagram and reporting
  # table name say LabTestFact.
  # Nullability not checked: no row is expanded in the screenshots.
  # Only columns with the database icon; SD-only columns left out (D116).
  LabTestFact:
    description: >
      Lab test fact. Each row is a lab test. For Epic data, every test performed in
      Beaker at any status; result-based columns only include what has been sent to the
      chart.
    granularity: >
      One row per lab test.
    columns:
      _IsDeleted:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is deleted
      _IsInferred:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is inferred
      Count:
        type: tinyint
        nullable: true
        description: >
          Artificial measure on which calculations can be done. The value is 0 for rows
          marked as deleted, 1 otherwise.
      LabDurableKey:
        type: bigint (foreign key to LabDim.DurableKey)
        nullable: true
        description: >
          Location where this test was performed or that is responsible for the test.
          For Epic data, this is the section or case type if available. Otherwise, it is
          the laboratory where the test was performed.
      LabTestKey:
        type: bigint (primary key)
        nullable: false
        description: >
          Surrogate key used to uniquely identify the record
      PatientDurableKey:
        type: bigint (foreign key to PatientDim.DurableKey)
        nullable: true
        description: >
          Patient the specimen was collected from
      PrioritizedDateKey:
        type: bigint (DateKey; foreign key to DateDim; partition key)
        nullable: true
        description: >
          Date the specimen was collected if known, otherwise the best available date
          representing the order. Not populated for Quality Control specimens. ... (the
          rest is cut off in the screenshot).
      PrioritizedInstant_X:
        type: datetime
        nullable: true
        description: >
          Date and time the specimen was collected if known, otherwise the best
          available date representing the specimen. This will be the resulting instant
          or the linked encounter's start instant, if available.
    standard_where:
      - "_IsDeleted = 0"
      - "PrioritizedDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"  # the partition key

  # Checked against its Cosmos dictionary page (2026-09-29; screenshots in
  # reference/DDict image refs/SourceDim/): columns, types, and
  # keys from the Columns tab's links (the page has no ER diagram).
  # OrganizationEpicId and OrganizationName are SD only (hidden in the
