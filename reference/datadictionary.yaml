      AdmissionDateKey:
        type: bigint (DateKey; foreign key to DateDim)
        nullable: true
        description: >
          DateKey for encounter admission date (for inpatient/observation encounters).
      AdmissionInstant:
        type: datetime
        nullable: true
        description: >
          Timestamp of admission; de-identified and time-shifted where applicable.
      AdmittingProviderDurableKey:
        type: bigint (foreign key to ProviderDim.DurableKey)
        nullable: true
        description: >
