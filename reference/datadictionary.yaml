  # Only columns with the database icon; SD-only columns left out (D116).
  MedicationDispenseFact:
    description: >
      Outpatient medication dispense fact table. Rows represent fills/dispenses from
      ambulatory or external pharmacies. Includes days supply, NDC, refills, and
      dispense timing. Only outpatient dispenses are present.
    granularity: >
      One row per medication dispense.
    columns:
      _IsDeleted:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is deleted
      _IsInferred:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is inferred
      Count:
        type: tinyint
        nullable: false
        description: >
          Artificial measure on which calculations can be done. The value is 0 for rows
          marked as deleted, 1 otherwise.
      DaysSupply:
        type: smallint
        nullable: true
        description: >
          Number of days supply dispensed of the medication.
      DispenseDataSourceType_X:
        type: nvarchar(300)
        nullable: true
        description: >
          Brief description of the type of data source that reported the dispense
      DoseUnit_X:
        type: nvarchar(300)
        nullable: true
        description: >
          Medication administration unit associated with MinimumDose_X
      FilledDateKey:
        type: bigint (DateKey; foreign key to DateDim)
        nullable: true
        description: >
          Date a fill was completed. For Willow dispenses, this is the date when the
          fill was finalized. For other dispenses, this is the date when the claim was
          filed, which may be different from the fill completion date.
      FilledInstant:
        type: datetime
        nullable: true
        description: >
          Date and time a fill was completed. For Willow dispenses, this is the date and
          time when the fill was finalized. For other dispenses, this is the date and
          time when the claim was filed, which may be different f... (the rest is
          cut off in the screenshot).
      FilledTimeOfDayKey:
        type: bigint (TimeOfDayKey; foreign key to TimeOfDayDim)
        nullable: true
        description: >
          Time of day a fill was completed. For Willow dispenses, this is the time of
          day when the fill was finalized. For other dispenses, this is the time of day
          when the claim was filed, which may be different from the... (the rest is
          cut off in the screenshot).
      FillNumber:
        type: nvarchar(50)
        nullable: true
        description: >
          The fill number for the current dispensed medication by the pharmacy.
          Designates the sequential order of the original fill or subsequent refills of
          a prescription. The first fill is a 1 for Willow dispenses. This fie...
          (the rest is cut off in the screenshot).
      FirstDispense:
        type: tinyint (flag)
        nullable: true
        description: >
          1/0 column that indicates whether the dispense is a first dose or fill. This
          column returns 1 if the dispense is a first dose or fill and 0 if the dispense
          isn't a first dose or fill.
      Frequency_X:
        type: nvarchar(100)
        nullable: true
        description: >
          String describing how often the medication is ordered to be taken (e.g. Every
          8 hours PRN)
      MedicationDispenseKey:
        type: bigint (primary key)
        nullable: false
        description: >
          Surrogate key used to uniquely identify the record
      MedicationKey:
        type: bigint (foreign key to MedicationDim)
        nullable: false
        description: >
          Medication or mixture associated with the order
      MedicationOrderKey:
        type: bigint (foreign key to MedicationOrderFact)
        nullable: true
        description: >
          Order record which the dispense belongs to. This is only populated for Willow
          dispenses.
      MedicationOrderWrittenDateKey_X:
        type: bigint (DateKey; foreign key to DateDim)
        nullable: true
        description: >
          The date that the medication order for this dispense was signed
      MinimumDose_X:
        type: numeric(19,4)
        nullable: true
        description: >
          Quantity of drug ordered to be administered at each dose. If order has a
          ranged dose (e.g. 1-2), the value in this column will be the smallest number
          in the range.
      Mode:
        type: nvarchar(50)
        nullable: true
        description: >
          Mode that indicates whether this was an inpatient or outpatient dispense.
          Currently, only dispenses with outpatient ordering mode orders appear in
          Cosmos.
      PatientDurableKey:
        type: bigint (foreign key to PatientDim.DurableKey)
        nullable: false
        description: >
          Patient associated with the order getting dispensed
      PrimaryComponentQuantity:
        type: numeric(26,5)
        nullable: true
        description: >
          Quantity of the primary component dispensed
      PrimaryComponentQuantityUnit:
        type: nvarchar(300)
        nullable: true
        description: >
          Unit for the quantity of the primary component dispensed
      PrimaryComponentUnformattedNdc:
        type: nvarchar(300)
        nullable: true
        description: >
          Raw 11-digit National Drug Code (NDC) for the primary component dispensed
      RawCodeSystem_X:
        type: nvarchar(300)
        nullable: true
        description: >
          Type of code associated with RawCodeValue_X
      RawCodeValue_X:
        type: nvarchar(300)
        nullable: true
        description: >
          Primary code identifying the type of drug dispensed
      RefillsRemaining_X:
        type: smallint
        nullable: true
        description: >
          Number of refills remaining on the order after this dispense
      RefillsWritten_X:
        type: smallint
        nullable: true
        description: >
          Number of refills ordered, excluding the initial implied dispense. Medications
          ordered to be dispensed exactly once will have a 0 in this column.
      Route_X:
        type: nvarchar(300)
        nullable: true
        description: >
          Ordered medication administration route (e.g. Oral)
      SourceComboKey_X:
        type: bigint (foreign key to MedicationEventSourceBridge)
        nullable: true
        description: >
          The source organization that reported this medication dispense.
      SupplyEndDateKey_X:
        type: bigint (DateKey; foreign key to DateDim)
        nullable: true
        description: >
          Date that supply for this dispense would end, if drug is taken as intended.
          Calculated from FilledDate + DaysSupply
    standard_where:
      - "_IsDeleted = 0"

  # Checked against its Cosmos dictionary page (2026-09-29; screenshots in
  # reference/DDict image refs/MedicationAdministrationFact/): columns, types, and
  # keys from its ER diagram.
  # Descriptions cut off at the right; the old ones kept. New columns' not transcribed.
  # Nullability not checked: no row is expanded in the screenshots.
  # Only columns with the database icon; SD-only columns left out (D116).
  MedicationAdministrationFact:
    description: >
      Medication administration fact table representing MAR actions. Contains
      administrations and non-given actions except Due. Filter using
      ActionIsMedAdministration or AdministrationAction values when selecting given
      doses. Incomplete data for some encounters; union with
      MedicationOrderComponentFact where Type_X = 'Administered Medication' can improve
      completeness.
    granularity: >
      One row per medication or feeding product administration.
    columns:
      _IsDeleted:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is deleted
      _IsInferred:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is inferred
      ActionIsMedAdministration:
        type: tinyint (flag)
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      AdministrationAction:
        type: nvarchar(300)
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      AdministrationDateKey:
        type: bigint (DateKey; foreign key to DateDim; partition key)
        nullable: true
        description: >
          DateKey representing administration date for the MAR action.
      AdministrationDepartmentKey:
        type: bigint (foreign key to DepartmentDim)
        nullable: true
        description: >
          Department where the administration action occurred or was recorded.
      AdministrationInstant:
        type: datetime
        nullable: true
        description: >
          Timestamp for the administration action (e.g., Given, Held). De-identified.
      AdministrationRoute:
        type: nvarchar(300)
        nullable: true
        description: >
          Route documented at administration time (e.g., PO, IV). Some intraoperative
          medications may have route only at administration.
      AdsOverride:
        type: tinyint (flag)
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      AgeKey:
        type: bigint (foreign key to DurationDim)
        nullable: true
        description: >
          Age key representing age at administration time.
      Concentration:
        type: nvarchar(200)
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      ConcentrationUnit:
        type: nvarchar(200)
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      Count:
        type: tinyint
        nullable: false
        description: >
          Cosmos row count indicator; typically 1 for real MAR rows. Placeholder rows
          have nonpositive keys and often NULL Count.
      Dose:
        type: nvarchar(200)
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      DoseUnit:
        type: nvarchar(300)
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      Duration:
        type: nvarchar(200)
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      DurationUnit:
        type: nvarchar(200)
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      EncounterAdmissionInstant:
        type: datetime
        nullable: true
        description: >
          Timestamp representing admission associated with the encounter, carried on the
          administration record.
      EncounterKey:
        type: bigint (foreign key to EncounterFact)
        nullable: true
        description: >
          Encounter associated with the medication order; for administrations in a
          different contact, this remains the ordering encounter.
      EquivalentMorphineDose:
        type: nvarchar(200)
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      EquivalentMorphineDosePerHourRate:
        type: nvarchar(200)
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      IsPrn:
        type: tinyint (flag)
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      MedicationAdministrationKey:
        type: bigint (primary key)
        nullable: false
        description: >
          Primary key for the medication administration fact row.
      MedicationComponentComboKey:
        type: bigint (foreign key to MedicationComponentBridge)
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      MedicationKey:
        type: bigint (foreign key to MedicationDim)
        nullable: false
        description: >
          Key to the medication record. Value -1 for mixture administrations; identify
          ingredients from order components when mixtures are in scope.
      MedicationOrderKey:
        type: bigint (foreign key to MedicationOrderFact)
        nullable: true
        description: >
          Links administration to its parent medication order. Never join directly to
          MedicationOrderComponentFact; route through MedicationOrderFact.
      PatientDurableKey:
        type: bigint (foreign key to PatientDim.DurableKey)
        nullable: false
        description: >
          Patient associated with the medication administration action.
      Rate:
        type: nvarchar(50)
        nullable: true
        description: >
          On the dictionary page; description cut off in the screenshot.
      ScheduledAdministrationDateKey:
        type: bigint (DateKey; foreign key to DateDim)
        nullable: true
