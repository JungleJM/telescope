      BaseName:
        type: nvarchar(100)
        nullable: true
        description: >
          Base name representing the core analyte or concept underlying the component.
      CommonName:
        type: nvarchar(300)
        nullable: true
        description: >
          Common display name for the component as used in clinical practice.
      DataType:
        type: nvarchar(300)
        nullable: true
        description: >
