    columns:
      _IsDeleted:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is deleted
      _IsInferred:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is inferred
      CompletedTransferEndDate_X:
        type: date
        nullable: true
        description: >
          The last date that data from this organization has been completely transferred
          to Cosmos. Each time a source organization upgrades to a new version, all new
          or modified data elements are transferred to C... (the rest is cut off in the
          screenshot).
      CompletedTransferStartDate_X:
        type: date
        nullable: true
        description: >
          The first date that data from this organization has been completely
          transferred to Cosmos. Each time a source organization upgrades to a new
          version, all new or modified data elements are transferred to C... (the rest
          is cut off in the screenshot).
      SourceCountry:
        type: nvarchar(300)
        nullable: true
        description: >
          The country associated with this source
      SourceKey:
        type: bigint (primary key)
        nullable: false
        description: >
          Surrogate key used to uniquely identify the record
      UseInCosmosAnalytics:
        type: tinyint (flag)
        nullable: true
        description: >
          1/0 column that indicates whether data associated with the record will be used
          in analytics on Cosmos. This column will only be populated in Epic hosted
          Cosmos environments. ... (the rest is cut off in the screenshot).
    standard_where:
      - "_IsDeleted = 0"

  # Checked against its Cosmos dictionary page (2026-09-29; screenshots in
  # reference/DDict image refs/EncounterSourceBridge/): columns, types, and
  # keys from the Columns tab's links (the page has no ER diagram).
