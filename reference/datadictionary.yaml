      the same organization. Referenced by DepartmentKey from EncounterFact,
      HospitalAdmissionFact and other facts; use it to group or stratify by
      specialty, or to restrict analyses to sites fully usable in Cosmos.
    granularity: >
      A bed, room, room group, care area, submitter, department, location, service
      area, facility profile, or business segment.
    columns:
      _IsDeleted:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is deleted
      _IsInferred:
        type: tinyint (flag)
        nullable: false
        description: >
          1/0 column that indicates whether the record is inferred
      Country:
        type: nvarchar(300)
        nullable: true
        description: >
          Associated country
      DepartmentKey:
        type: bigint (primary key)
        nullable: false
        description: >
          Surrogate key used to uniquely identify the record. Negative keys are
          structural placeholders, not real departments.
      DepartmentSpecialty:
        type: nvarchar(300)
        nullable: true
        description: >
          Specialty practiced in the department
      SiteFullyUsableInCosmosEndDateKey_X:
        type: bigint (DateKey; foreign key to DateDim)
        nullable: true
        description: >
          The last month with 25% or more of the site's monthly non-zero encounter
