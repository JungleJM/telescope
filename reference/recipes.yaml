batching_recipes:
  - name: state
    description: Split each expanded PK table by patient state abbreviation.
    kind: column_values
    applies_to: PKTable
    required_column: StateOrProvinceAbbreviation
    values: all

  - name: sex
    description: Split each expanded PK table by patient sex.
    kind: column_values
    applies_to: PKTable
    required_column: Sex
    values:
      - Female
      - Male

  - name: chunk
    description: Split each expanded PK table into row-count chunks; downstream fact tables join to the matching PK chunk.
    kind: row_chunk
    applies_to: PKTable
    rows_per_batch: required

recipes:
  - name: PatientWithDx
    description: First DiagnosisEvent of disease X for patient, with patient info (sex, birthdate etc) and Index Event info (Age at Diagnosis, ICD code, etc.)
    granularity: One DiagnosisEvent, only the earliest found, for each patient (by PatientDurableKey).
    type: PK
    pull_this_cycle: true
    dest_table: Patients
    dedup_keys:
      - [PatientDurableKey]
    dedup_order_by:
      - IndexDate
    columns:
      - source: dxf.PatientDurableKey
        name: PatientDurableKey
        nullable: false

      - source: p.Sex
        name: Sex
        nullable: true

      - source: dt.NameAndCode
        name: ICDName
        nullable: true

      - source: dur.Years
        name: AgeAtIndexDiagnosis
        nullable: true
        description: "Age in Years of patient at earliest diagnosis of index condition"

      - source: p.BirthDate
        name: BirthDate
        nullable: true

      - source: p.StateOrProvince
        name: StateOrProvince
        nullable: true

      - source: p.StateOrProvinceAbbreviation
        name: StateOrProvinceAbbreviation
        nullable: false

      - source: p.Country
        name: Country
        nullable: true

      - source: dt.Value
        name: ICDCode
        nullable: true

      - source: dxf.StartDateKey
        name: IndexDate
        nullable: true

      # Everything else:
      - source: dxf.DiagnosisEventKey
        name: DiagnosisEventKey
        nullable: false

      - source: dxf.EncounterKey
        name: IndexEncounter
        nullable: false

      - source: p.DurableKey
        name: DurableKey
        nullable: false

      - source: p.FirstRace
        name: FirstRace
        nullable: true

      - source: p.SecondRace
        name: SecondRace
        nullable: true

      - source: p.ThirdRace
        name: ThirdRace
        nullable: true

      - source: p.FourthRace
        name: FourthRace
        nullable: true

      - source: p.FifthRace
        name: FifthRace
        nullable: true

      - source: p.SviRacialEthnicMinorityStatusPctlRankByZip2020_X
        name: SviRacialEthnicMinorityStatusPctlRankByZip2020_X
        nullable: true

      - source: p.SviOverallPctlRankByZip2020_X
        name: SviOverallPctlRankByZip2020_X
        nullable: true

      - source: p.SviSocioeconomicPctlRankByZip2020_X
        name: SviSocioeconomicPctlRankByZip2020_X
        nullable: true

    filter:
      from:
        - DiagnosisEventFact as dxf
      join:
        - "INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = dxf.DiagnosisKey"
        - "INNER JOIN PatientDim AS p ON p.DurableKey = dxf.PatientDurableKey"
        - "INNER JOIN DurationDim AS dur ON dur.DurationKey = dxf.AgeKey"
      where:
        - "dxf.StartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
        - "dxf.StartDateKey >= 0"
        - "dxf._IsDeleted = 0"
        - "dt._IsDeleted = 0"
        - "p.IsValid = 1"
        - "p.IsCurrent = 1"
        - "p.UseInCosmosAnalytics_X = 1"
        - "dt.Type IN ('ICD-10-AM','ICD-10-CA','ICD-10-CM', 'ICD-9-CM')"
        - "{{sql_condition('dt.Value', ICD_Value)}}"

  - name: IndexDiagnosis
    description: Each patient's first diagnosis of each of the disease's codes (ICD_Value), with date, age at diagnosis, event data
    granularity: One diagnoses of a disease by ICD code, for each PatientDurableKey. 
    dedup_keys:
      - [PatientDurableKey, BillingCodeValue]
    dedup_order_by:
      - StartDateKey
    pull_this_cycle: true 
    type: fact
    dest_table: IndexDiagnosis
    columns:
      - source: def.DiagnosisEventKey
        name: DiagnosisEventKey
        nullable: false

      - source: tc.StandardName
        name: BillingCodeType
        nullable: true
        description: "ICD code type"

      - source: dt.Value
        name: BillingCodeValue
        nullable: true

      - source: dt.NameAndCode
        name: NameAndCode
        nullable: true

      - source: dur.Years
        name: AgeAtDiagnosis
        nullable: true

      - source: def.IsPrimary
        name: IsPrimary
        nullable: true

      - source: dt.ReferenceBillingCode
        name: IsReferenceBillingCode
        nullable: true
        description: "0/1 of if this was used as the code for Billing submission"

      - source: def.Type
        name: TypeOfDx
        nullable: true

      - source: tc.Concept
        name: TerminologyConcept
        nullable: true

      - source: tc.Name
        name: TerminologyName
        nullable: true

      - source: def.Status
        name: Status
        nullable: true

      - source: def.StartDateKey
        name: StartDateKey
        nullable: true

      - source: def.EndDateKey
        name: EndDateKey
        nullable: true

      - source: def.PatientDurableKey
        name: PatientDurableKey
        nullable: false

      - source: def.DiagnosisKey
        name: DiagnosisKey
        nullable: false

      - source: def.EncounterKey
        name: EncounterKey
        nullable: false

    filter:
      from:
        - DiagnosisEventFact AS def
      join:
        - "INNER JOIN {{prefix}}_{{PKTable}} AS pk ON pk.PatientDurableKey = def.PatientDurableKey"
        - "LEFT JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = def.DiagnosisKey"
        - "LEFT JOIN TerminologyConceptDim AS tc ON tc.TerminologyConceptKey = dt.TerminologyConceptKey"
        - "INNER JOIN DurationDim AS dur ON dur.DurationKey = def.AgeKey"
      where:
        - "def._IsDeleted = 0"
        - "dt._IsDeleted = 0"
        - "def.StartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
        - "dt.Type IN ('ICD-10-AM', 'ICD-10-CA', 'ICD-10-CM')"
        - "{{sql_condition('dt.Value', ICD_Value)}}"

  - name: OtherDiagnoses
    description: Patient's diagnoses besides the index diagnosis - one per patient per diagnosis code, not time-based. For seeing if they have other conditions
    granularity: One diagnoses of a disease by ICD code, for each PatientDurableKey. 
    dedup_keys:
      - [PatientDurableKey, BillingCodeValue]
    dedup_order_by:
      - StartDateKey
    pull_this_cycle: true 
    type: fact
    dest_table: OtherDiagnoses
    columns:
      - source: def.DiagnosisEventKey
        name: DiagnosisEventKey
        nullable: false

      - source: tc.StandardName
        name: BillingCodeType
        nullable: true
        description: "ICD code type"

      - source: dt.Value
        name: BillingCodeValue
        nullable: true

      - source: dt.NameAndCode
        name: NameAndCode
        nullable: true

      - source: dur.Years
        name: AgeAtDiagnosis
        nullable: true

      - source: def.IsPrimary
        name: IsPrimary
        nullable: true

      - source: dt.ReferenceBillingCode
        name: IsReferenceBillingCode
        nullable: true
        description: "0/1 of if this diagnosis was used for Billing submission"

      - source: def.Type
        name: TypeOfDx
        nullable: true

      - source: tc.Concept
        name: TerminologyConcept
        nullable: true

      - source: tc.Name
        name: TerminologyName
        nullable: true

      - source: def.Status
        name: Status
        nullable: true

      - source: def.StartDateKey
        name: StartDateKey
        nullable: true

      - source: def.EndDateKey
        name: EndDateKey
        nullable: true

      - source: def.PatientDurableKey
        name: PatientDurableKey
        nullable: false

      - source: def.DiagnosisKey
        name: DiagnosisKey
        nullable: false

      - source: def.EncounterKey
        name: EncounterKey
        nullable: false

    filter:
      from:
        - DiagnosisEventFact AS def
      join:
        - "INNER JOIN {{prefix}}_{{PKTable}} AS pk ON pk.PatientDurableKey = def.PatientDurableKey AND pk.DiagnosisEventKey <> def.DiagnosisEventKey"
        - "LEFT JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = def.DiagnosisKey"
        - "LEFT JOIN TerminologyConceptDim AS tc ON tc.TerminologyConceptKey = dt.TerminologyConceptKey"
        - "INNER JOIN DurationDim AS dur ON dur.DurationKey = def.AgeKey"
      where:
        - "def._IsDeleted = 0"
        - "dt._IsDeleted = 0"
        - "def.StartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
        - "dt.Type IN ('ICD-10-AM', 'ICD-10-CA', 'ICD-10-CM')"

  - name: HospitalizationsWithinICDCode
    description: >
      Hospitalizations with a diagnosis in the pull's hospital ICD list
      (`HospitalICDTable`, an upload of `DiagnosisCode`s). Was OtherHospitalizations (D184).
    granularity: InpatientEncounterKey is per-hospitalization. 
    type: fact
    pull_this_cycle: true
    dest_table: HospitalizationsWithinICDCode
    dedup_keys:
      - [InpatientEncounterKey]
    columns:
      - source: haf.HospitalAdmissionKey
        name: HospitalAdmissionKey
        nullable: false

      - source: haf.EncounterKey
        name: InpatientEncounterKey
        nullable: false

      - source: haf.PatientDurableKey
        name: PatientDurableKey
        nullable: false

      - source: haf.AdmissionDateKey
        name: AdmissionDateKey
        nullable: false

      - source: haf.InpatientAdmissionInstant
        name: InpatientAdmissionInstant
        nullable: false

      - source: haf.DischargeDateKey
        name: DischargeDateKey
        nullable: true

      - source: haf.DischargeInstant
        name: DischargeInstant
        nullable: true

      - source: haf.DischargeDisposition
        name: DischargeDisposition
        nullable: true

      - source: haf.InpatientLengthOfStayInDays
        name: InpatientLengthOfStayInDays
        nullable: true

      - source: haf.LengthOfStayInDays
        name: LengthOfStayInDays
        nullable: true

      - source: haf.DaysSincePriorAdmission_X
        name: DaysSincePriorAdmission_X
        nullable: true

      - source: haf.ReadmissionCausedByKey_X
        name: ReadmissionCausedByKey_X
        nullable: true

      - source: haf.IsPlannedReadmission_X
        name: IsPlannedReadmission_X
        nullable: true

      - source: haf.IsUnplannedReadmission_X
        name: IsUnplannedReadmission_X
        nullable: true

      - source: haf.EncounterType
        name: EncounterType
        nullable: true

      - source: haf.FinancialClass
        name: FinancialClass
        nullable: true

      # optional: ICD for the qualifying diagnosis
      - source: dt.Value
        name: ICDCode
        nullable: true

      - source: dt.NameAndCode
        name: ICDName
        nullable: true

    filter:
      from:
        - HospitalAdmissionFact AS haf
      join:
        - "INNER JOIN {{prefix}}_{{PKTable}} AS pk ON pk.PatientDurableKey = haf.PatientDurableKey"
        # Bring in diagnosis events on the same encounter
        - "INNER JOIN DiagnosisEventFact AS dxf ON dxf.EncounterKey = haf.EncounterKey"
        - "INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = dxf.DiagnosisKey"
        - "INNER JOIN {{prefix}}_{{HospitalICDTable}} AS ih ON ih.DiagnosisCode = dt.Value"
      where:
        - "haf._IsDeleted = 0"
        - "haf.AdmissionDateKey IS NOT NULL"
        - "haf.AdmissionDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
        - "dxf._IsDeleted = 0"
        - "dt._IsDeleted = 0"
        - "dt.Type IN ('ICD-10-AM', 'ICD-10-CA', 'ICD-10-CM', 'ICD-9-CM')"

  - name: EDVisitByDiagnosisAndIndexAge
    description: Looks at ED Visits with a specific diagnosis (ICD_Value), for patients aged IndexAgeMin to IndexAgeMax years
    granularity: One row per ED visit
    type: PK
    dest_table: EDVisits
    pull_this_cycle: true # if off, will not run this specific function.
    dedup_keys: 
      - [EdVisitKey]
    dedup_order_by: 
      - ArrivalDateKey
    columns:
      - source: pk.EdVisitKey
        name: EdVisitKey
        nullable: false

      - source: pk.EncounterKey
        name: EncounterKey
        nullable: false

      - source: pk.PatientDurableKey
        name: PatientDurableKey
        nullable: false

      - source: pk.ArrivalDateKey
        name: ArrivalDateKey
        nullable: false

      - source: pk.HospitalAdmissionKey
        name: HospitalAdmissionKey
        nullable: true # Some ED visits may not be admitted; allow NULL.

      - source: age.Years
        name: AgeAtVisit
        nullable: true
        description: "Age in years at the ED visit"

    filter:
      from: "EdVisitFact AS pk"
      join:
        - "INNER JOIN DiagnosisEventFact AS d ON d.EncounterKey = pk.EncounterKey AND d.PatientDurableKey = pk.PatientDurableKey"
        - "INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = d.DiagnosisKey"
        - "INNER JOIN DurationDim AS age ON age.DurationKey = pk.AgeKey"
      where:
        - "d._IsDeleted = 0"
        - "dt._IsDeleted = 0"
        - "pk.ArrivalDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
        - "pk.ArrivalDateKey >= 0"
        - "age.Years BETWEEN {{IndexAgeMin}} AND {{IndexAgeMax}}"
        - "d.EmergencyDepartmentDiagnosis = 1"
        - "dt.Type IN ('ICD-10-AM', 'ICD-10-CA', 'ICD-10-CM')"
        - "{{sql_condition('dt.Value', ICD_Value)}}"
