cohorts:
  - name: HatPatients
    type: fact
    pull_this_cycle: false
    dest_table: HatPatients
    dedup_keys:
      - [PatientDurableKey]
    dedup_order_by:
      - IndexDate

    columns:
      # Primary ordering per request:
      - source: dxf.PatientDurableKey
        name: PatientDurableKey
        type: BIGINT
        nullable: false

      - source: p.Sex
        name: Sex
        type: VARCHAR(50)
        nullable: true

      - source: dt.NameAndCode
        name: ICDName
        type: VARCHAR(400)
        nullable: true

      - source: dxf.AgeKey
        name: IndexAge
        type: BIGINT
        nullable: true

      - source: p.BirthDate
        name: BirthDate
        type: DATE
        nullable: true

      - source: p.StateOrProvince
        name: StateOrProvince
        type: VARCHAR(100)
        nullable: true

      - source: p.Country
        name: Country
        type: VARCHAR(100)
        nullable: true

      - source: dt.Value
        name: ICDCode
        type: VARCHAR(400)
        nullable: true

      - source: dxf.StartDateKey
        name: IndexDate
        type: INT
        nullable: true

      # Everything else:
      - source: dxf.DiagnosisEventKey
        name: DiagnosisEventKey
        type: BIGINT
        nullable: false

      - source: dxf.EncounterKey
        name: IndexEncounter
        type: BIGINT
        nullable: false

      - source: p.DurableKey
        name: DurableKey
        type: BIGINT
        nullable: false

      - source: p.FirstRace
        name: FirstRace
        type: VARCHAR(100)
        nullable: true

      - source: p.SecondRace
        name: SecondRace
        type: VARCHAR(100)
        nullable: true

      - source: p.ThirdRace
        name: ThirdRace
        type: VARCHAR(100)
        nullable: true

      - source: p.FourthRace
        name: FourthRace
        type: VARCHAR(100)
        nullable: true

      - source: p.FifthRace
        name: FifthRace
        type: VARCHAR(100)
        nullable: true

      - source: p.SviRacialEthnicMinorityStatusPctlRankByZip2020_X
        name: SviRacialEthnicMinorityStatusPctlRankByZip2020_X
        type: FLOAT
        nullable: true

      - source: p.SviOverallPctlRankByZip2020_X
        name: SviOverallPctlRankByZip2020_X
        type: FLOAT
        nullable: true

      - source: p.SviSocioeconomicPctlRankByZip2020_X
        name: SviSocioeconomicPctlRankByZip2020_X
        type: FLOAT
        nullable: true

    filter:
      from:
        - DiagnosisEventFact AS dxf

      join:
        - "INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = dxf.DiagnosisKey"
        - "INNER JOIN PatientDim AS p ON p.DurableKey = dxf.PatientDurableKey"

      where:
        - "dxf.StartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
        - "dxf.StartDateKey >= 0"
        - "dxf._IsDeleted = 0"
        - "dt._IsDeleted = 0"
        - "p.IsValid = 1"
        - "p.IsCurrent = 1"
        - "p.UseInCosmosAnalytics_X = 1"
        - "dt.Type IN ('ICD-10-AM','ICD-10-CA','ICD-10-CM', 'ICD-9 CM')"
        - "dt.Value IN ('D89.44')"
