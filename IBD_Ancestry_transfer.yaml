transfer:
  from_template: IBD_Ancestry_temp.yaml
  recipes_sha256: c64193205961
  recipes_used:
  - OtherDiagnoses
  - PatientWithDx
  - sex
cosmos_vars:
  project_db: PROJECTD93A5E7
  cosmos_db: Dual
run_vars:
  min_date_key: 19900101
  max_date_key: 20260601
test_options:
  smallset: true
  stop_at_for_pk_table: 3000
  random_pk_sample: true
project_vars:
  project_folder: IBD Ancestry
vars:
upload_cohorts:
- name: IBD_Meds
  dest_table: IBD_Meds
  file_type: parquet
  push_this_cycle: true
  file_loc: data/Meds/ibd/IBD_Meds.parquet
multipliers:
- name: IBDType
  stage: during_build
  levels:
  - strat: Crohns
    vars:
      ICD_Value:
      - "K50.%"
  - strat: UC
    vars:
      ICD_Value:
      - "K51.%"
- name: Race
  stage: split_after_build
  levels:
  - strat: black
    column: FirstRace
    values:
    - "Black%"
  - strat: white
    column: FirstRace
    values:
    - "White%"
    role: control
    row_mult: 4
  applies_to: PKTable
batching:
- name: sex
  description: Split each expanded PK table by patient sex.
  kind: column_values
  applies_to: PKTable
  column: Sex
  values:
  - Female
  - Male
cohorts:
- name: Patients
  description: First DiagnosisEvent of disease X for patient, with patient info (sex,
    birthdate etc) and Index Event info (Age at Diagnosis, ICD code, etc.)
  granularity: One DiagnosisEvent, only the earliest found, for each patient (by PatientDurableKey).
  type: PK
  pull_this_cycle: true
  dest_table: Patients
  dedup_keys:
  - - PatientDurableKey
  dedup_order_by:
  - IndexDate
  columns:
  - source: dxf.PatientDurableKey
    name: PatientDurableKey
    type: BIGINT
    nullable: false
  - source: p.Sex
    name: Sex
    type: VARCHAR(50)
    nullable: true
  - source: dt.NameAndCode
    name: ICDName
    type: VARCHAR(400)
    nullable: true
  - source: dur.Years
    name: AgeAtIndexDiagnosis
    type: BIGINT
    nullable: true
    description: "Age in Years of patient at earliest diagnosis of index condition"
  - source: p.BirthDate
    name: BirthDate
    type: DATE
    nullable: true
  - source: p.StateOrProvince
    name: StateOrProvince
    type: VARCHAR(100)
    nullable: true
  - source: p.StateOrProvinceAbbreviation
    name: StateOrProvinceAbbreviation
    type: VARCHAR(300)
    nullable: false
  - source: p.Country
    name: Country
    type: VARCHAR(100)
    nullable: true
  - source: dt.Value
    name: ICDCode
    type: VARCHAR(400)
    nullable: true
  - source: dxf.StartDateKey
    name: IndexDate
    type: INT
    nullable: true
  - source: dxf.DiagnosisEventKey
    name: DiagnosisEventKey
    type: BIGINT
    nullable: false
  - source: dxf.EncounterKey
    name: IndexEncounter
    type: BIGINT
    nullable: false
  - source: p.DurableKey
    name: DurableKey
    type: BIGINT
    nullable: false
  - source: p.FirstRace
    name: FirstRace
    type: VARCHAR(100)
    nullable: true
  - source: p.SecondRace
    name: SecondRace
    type: VARCHAR(100)
    nullable: true
  - source: p.ThirdRace
    name: ThirdRace
    type: VARCHAR(100)
    nullable: true
  - source: p.FourthRace
    name: FourthRace
    type: VARCHAR(100)
    nullable: true
  - source: p.FifthRace
    name: FifthRace
    type: VARCHAR(100)
    nullable: true
  - source: p.SviRacialEthnicMinorityStatusPctlRankByZip2020_X
    name: SviRacialEthnicMinorityStatusPctlRankByZip2020_X
    type: FLOAT
    nullable: true
  - source: p.SviOverallPctlRankByZip2020_X
    name: SviOverallPctlRankByZip2020_X
    type: FLOAT
    nullable: true
  - source: p.SviSocioeconomicPctlRankByZip2020_X
    name: SviSocioeconomicPctlRankByZip2020_X
    type: FLOAT
    nullable: true
  filter:
    from:
    - DiagnosisEventFact as dxf
    join:
    - "INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = dxf.DiagnosisKey"
    - "INNER JOIN PatientDim AS p ON p.DurableKey = dxf.PatientDurableKey"
    - "INNER JOIN DurationDim AS dur ON dur.DurationKey = dxf.AgeKey"
    where:
    - "dxf.StartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
    - "dxf.StartDateKey >= 0"
    - "dxf._IsDeleted = 0"
    - "dt._IsDeleted = 0"
    - "p.IsValid = 1"
    - "p.IsCurrent = 1"
    - "p.UseInCosmosAnalytics_X = 1"
    - "dt.Type IN ('ICD-10-AM','ICD-10-CA','ICD-10-CM', 'ICD-9 CM')"
    - "{{sql_condition('dt.Value', ICD_Value)}}"
- name: OtherDiagnoses
  description: Patient's diagnoses besides the index diagnosis - one per patient per
    diagnosis code, not time-based. For seeing if they have other conditions
  granularity: One diagnoses of a disease by ICD code, for each PatientDurableKey.
  dedup_keys:
  - - PatientDurableKey
    - BillingCodeValue
  dedup_order_by:
  - StartDateKey
  pull_this_cycle: true
  type: fact
  dest_table: OtherDiagnoses
  columns:
  - source: def.DiagnosisEventKey
    name: DiagnosisEventKey
    type: BIGINT
    nullable: false
  - source: tc.StandardName
    name: BillingCodeType
    type: VARCHAR(400)
    nullable: true
    description: "ICD code type"
  - source: dt.Value
    name: BillingCodeValue
    type: VARCHAR(400)
    nullable: true
  - source: dt.NameAndCode
    name: NameAndCode
    type: VARCHAR(400)
    nullable: true
  - source: dur.Years
    name: AgeAtDiagnosis
    type: INT
    nullable: true
  - source: def.IsPrimary
    name: IsPrimary
    type: BIT
    nullable: true
  - source: dt.ReferenceBillingCode
    name: IsReferenceBillingCode
    type: VARCHAR(100)
    nullable: true
    description: "0/1 of if this diagnosis was used for Billing submission"
  - source: def.Type
    name: TypeOfDx
    type: VARCHAR(100)
    nullable: true
  - source: tc.Concept
    name: TerminologyConcept
    type: VARCHAR(400)
    nullable: true
  - source: tc.Name
    name: TerminologyName
    type: VARCHAR(400)
    nullable: true
  - source: def.Status
    name: Status
    type: VARCHAR(100)
    nullable: true
  - source: def.StartDateKey
    name: StartDateKey
    type: INT
    nullable: true
  - source: def.EndDateKey
    name: EndDateKey
    type: INT
    nullable: true
  - source: def.PatientDurableKey
    name: PatientDurableKey
    type: BIGINT
    nullable: false
  - source: def.DiagnosisKey
    name: DiagnosisKey
    type: BIGINT
    nullable: false
  - source: def.EncounterKey
    name: EncounterKey
    type: BIGINT
    nullable: false
  filter:
    from:
    - DiagnosisEventFact AS def
    join:
    - "INNER JOIN {{prefix}}_{{PKTable}} AS pk ON pk.PatientDurableKey = def.PatientDurableKey\
      \ AND pk.DiagnosisEventKey <> def.DiagnosisEventKey"
    - "LEFT JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = def.DiagnosisKey"
    - "LEFT JOIN TerminologyConceptDim AS tc ON tc.TerminologyConceptKey = dt.TerminologyConceptKey"
    - "INNER JOIN DurationDim AS dur ON dur.DurationKey = def.AgeKey"
    where:
    - "def._IsDeleted = 0"
    - "dt._IsDeleted = 0"
    - "def.StartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
    - "dt.Type IN ('ICD-10-AM', 'ICD-10-CA', 'ICD-10-CM')"
