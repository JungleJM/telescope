blueprint:
  from_template: GERD_intake.yaml
  recipes_sha256: 8d78f39f47e0
  recipes_used:
  - PatientWithDx
cosmos_vars:
  project_db: PROJECTD93A5E7
  cosmos_db: Cosmos
run_vars:
  min_date_key: 20150101
  max_date_key: 20260601
test_options:
  smallset: false
  stop_at_for_pk_table: 10
  random_pk_sample: false
project_vars:
  project_folder: GERD
vars: {}
upload_cohorts: []
multipliers:
- name: Disease
  stage: during_build
  levels:
  - strat: GERD
    vars:
      ICD_Value:
      - "530.81"
      - "530.11"
      - "K21%"
- name: Part
  stage: split_after_build
  applies_to: PKTable
  levels:
  - strat: p0of5
    where: "dxf.PatientDurableKey % 5 = 0"
  - strat: p1of5
    where: "dxf.PatientDurableKey % 5 = 1"
  - strat: p2of5
    where: "dxf.PatientDurableKey % 5 = 2"
  - strat: p3of5
    where: "dxf.PatientDurableKey % 5 = 3"
  - strat: p4of5
    where: "dxf.PatientDurableKey % 5 = 4"
batching: []
cohorts:
- name: PtsWithDx
  description: Diagnosis event fact table. Rows represent diagnoses associated with
    encounters, problem lists, or other contexts. Use DISTINCT EncounterKey or PatientDurableKey
    for prevalence; rows are at the billing/event grain. First DiagnosisEvent of disease
    X for patient, with patient info (sex, birthdate etc) and Index Event info (Age
    at Diagnosis, ICD code, etc.)
  granularity: One DiagnosisEvent, only the earliest found, for each patient (by PatientDurableKey).
  type: PK
  pull_this_cycle: true
  dest_table: PtsWithDx
  dedup_keys:
  - - PatientDurableKey
  dedup_order_by:
  - IndexDate
  columns:
  - source: dxf.PatientDurableKey
    name: PatientDurableKey
    nullable: false
    type: BIGINT
  - source: p.Sex
    name: Sex
    nullable: true
    type: NVARCHAR(300)
  - source: dur.Years
    name: AgeAtIndexDiagnosis
    nullable: true
    description: Duration expressed in years. Age in Years of patient at earliest
      diagnosis of index condition
    type: INT
  - source: p.BirthDate
    name: BirthDate
    nullable: true
    type: DATE
  - source: p.StateOrProvince
    name: StateOrProvince
    nullable: true
    type: NVARCHAR(300)
  - source: p.StateOrProvinceAbbreviation
    name: StateOrProvinceAbbreviation
    nullable: false
    type: NVARCHAR(300)
  - source: dt.Value
    name: ICDCode
    nullable: true
    type: NVARCHAR(300)
  - source: dxf.StartDateKey
    name: IndexDate
    nullable: true
    type: BIGINT
  - source: dxf.DiagnosisEventKey
    name: DiagnosisEventKey
    nullable: false
    type: BIGINT
  - source: dxf.EncounterKey
    name: IndexEncounter
    nullable: false
    type: BIGINT
  - source: dxf.EndDateKey
    name: IndexEndDate
    nullable: true
    type: BIGINT
  - source: dxf.Type
    name: IndexDxType
    nullable: true
    description: Diagnosis type (e.g., billing, problem list, admission, discharge),
      per source. What kind of diagnosis the index event is (an encounter diagnosis,
      a problem list entry...)
    type: NVARCHAR(350)
  - source: dxf.Status
    name: IndexDxStatus
    nullable: true
    description: Diagnosis status (e.g., active, resolved, ruled out) depending on
      context. The index event's status, such as active, resolved or ruled out
    type: NVARCHAR(300)
  - source: dxf.IsPrimary
    name: IndexIsPrimary
    nullable: true
    description: Indicates diagnosis is marked as primary or principal for the encounter.
      1 if the index event was its encounter's primary diagnosis
    type: TINYINT
  - source: p.FirstRace
    name: FirstRace
    nullable: true
    type: NVARCHAR(300)
  - source: p.SecondRace
    name: SecondRace
    nullable: true
    type: NVARCHAR(300)
  - source: p.SviRacialEthnicMinorityStatusPctlRankByZip2020_X
    name: SviRacialEthnicMinorityStatusPctlRankByZip2020_X
    nullable: true
    type: NUMERIC(6,4)
  - source: p.SviOverallPctlRankByZip2020_X
    name: SviOverallPctlRankByZip2020_X
    nullable: true
    type: NUMERIC(6,4)
  - source: p.SviSocioeconomicPctlRankByZip2020_X
    name: SviSocioeconomicPctlRankByZip2020_X
    nullable: true
    type: NUMERIC(6,4)
  filter:
    from:
    - DiagnosisEventFact as dxf
    join:
    - "INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = dxf.DiagnosisKey"
    - "INNER JOIN PatientDim AS p ON p.DurableKey = dxf.PatientDurableKey"
    - "INNER JOIN DurationDim AS dur ON dur.DurationKey = dxf.AgeKey"
    where:
    - "dxf.StartDateKey BETWEEN {{min_date_key}} AND {{max_date_key}}"
    - "dxf.StartDateKey >= 0"
    - "dxf._IsDeleted = 0"
    - "dt._IsDeleted = 0"
    - "p.IsValid = 1"
    - "p.IsCurrent = 1"
    - "p.UseInCosmosAnalytics_X = 1"
    - "dt.Type IN ('ICD-10-AM','ICD-10-CA','ICD-10-CM', 'ICD-9-CM')"
    - "{{sql_condition('dt.Value', ICD_Value)}}"
