project_db: PROJECTD33A929
cosmos_db: COSMOS
project_folder: "Manager Valid Basic"
vars:
  min_date_key: 20200101
  max_date_key: 20240101
  HospitalICDTable: HospitalICDCodes
  ICD_Value:
  - K50
  - K51
upload_cohorts:
- name: HospitalICDCodes
  dest_table: HospitalICDCodes
  file_type: parquet
  file_loc: uploads/hospital_icd_codes.parquet
  push_this_cycle: true
temp_prefix: manvalbas
pull_context:
  session_id: Patients
  phase: pk
  cohort: Patients
  pk_table: Patients
  pk_source:
    kind: generated
    table: Patients
cohorts:
- name: Patients
  description: First DiagnosisEvent of diseaseX for patient, with patient info 
    (sex, birthdate etc) and Index Event info (Age at Diagnosis, ICD code, etc.)
  type: PK
  pull_this_cycle: true
  dest_table: Patients
  dedup_keys:
  - - PatientDurableKey
  dedup_order_by:
  - IndexDate
  columns:
  - source: dxf.PatientDurableKey
    name: PatientDurableKey
    type: BIGINT
    nullable: false
  - source: p.Sex
    name: Sex
    type: VARCHAR(50)
    nullable: true
  - source: dt.NameAndCode
    name: ICDName
    type: VARCHAR(400)
    nullable: true
  - source: dur.Years
    name: AgeAtIndexDiagnosis
    type: BIGINT
    nullable: true
  - source: p.BirthDate
    name: BirthDate
    type: DATE
    nullable: true
  - source: p.StateOrProvince
    name: StateOrProvince
    type: VARCHAR(100)
    nullable: true
  - source: p.StateOrProvinceAbbreviation
    name: StateOrProvinceAbbreviation
    type: VARCHAR(300)
    nullable: false
  - source: p.Country
    name: Country
    type: VARCHAR(100)
    nullable: true
  - source: dt.Value
    name: ICDCode
    type: VARCHAR(400)
    nullable: true
  - source: dxf.StartDateKey
    name: IndexDate
    type: INT
    nullable: true
  - source: dxf.DiagnosisEventKey
    name: DiagnosisEventKey
    type: BIGINT
    nullable: false
  - source: dxf.EncounterKey
    name: IndexEncounter
    type: BIGINT
    nullable: false
  - source: p.DurableKey
    name: DurableKey
    type: BIGINT
    nullable: false
  - source: p.FirstRace
    name: FirstRace
    type: VARCHAR(100)
    nullable: true
  - source: p.SecondRace
    name: SecondRace
    type: VARCHAR(100)
    nullable: true
  - source: p.ThirdRace
    name: ThirdRace
    type: VARCHAR(100)
    nullable: true
  - source: p.FourthRace
    name: FourthRace
    type: VARCHAR(100)
    nullable: true
  - source: p.FifthRace
    name: FifthRace
    type: VARCHAR(100)
    nullable: true
  - source: p.SviRacialEthnicMinorityStatusPctlRankByZip2020_X
    name: SviRacialEthnicMinorityStatusPctlRankByZip2020_X
    type: FLOAT
    nullable: true
  - source: p.SviOverallPctlRankByZip2020_X
    name: SviOverallPctlRankByZip2020_X
    type: FLOAT
    nullable: true
  - source: p.SviSocioeconomicPctlRankByZip2020_X
    name: SviSocioeconomicPctlRankByZip2020_X
    type: FLOAT
    nullable: true
  filter:
    from:
    - DiagnosisEventFact as dxf
    join:
    - INNER JOIN DiagnosisTerminologyDim AS dt ON dt.DiagnosisKey = 
      dxf.DiagnosisKey
    - INNER JOIN PatientDim AS p ON p.DurableKey = dxf.PatientDurableKey
    - INNER JOIN DurationDim AS dur ON dur.DurationKey = dxf.AgeKey
    where:
    - dxf.StartDateKey BETWEEN 20200101 AND 20240101
    - dxf.StartDateKey >= 0
    - dxf._IsDeleted = 0
    - dt._IsDeleted = 0
    - p.IsValid = 1
    - p.IsCurrent = 1
    - p.UseInCosmosAnalytics_X = 1
    - dt.Type IN ('ICD-10-AM','ICD-10-CA','ICD-10-CM', 'ICD-9 CM')
    - dt.Value IN ('K50', 'K51')
  session_pk: Patients
  batching: []
